<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyblade X – Score Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-user-select: none;
  user-select: none;
}

:root {
  --cyan:  #00ffff;
  --red:   #ff2244;
  --green: #00ff9d;
  --gold:  #ffd700;
  --bg:    #020609;
  --dim:   #2a4a58;
}

body {
  background: var(--bg);
  color: white;
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.bg-energy {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 120% 80% at 0% 50%, rgba(0,255,255,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 120% 80% at 100% 50%, rgba(255,34,68,0.07) 0%, transparent 55%);
  animation: breathe 8s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 1; }
}

/* ===== WEAPON WHEEL ===== */
/* Backdrop dismiss layer */
.wheelBackdrop {
  position: fixed;
  inset: 0;
  z-index: 49;
  display: none;
}
.wheelBackdrop.open { display: block; }

/* The SVG quarter-wheel anchored to bottom-right corner */
.wheelSvg {
  position: fixed;
  right: 0; bottom: 0;
  width: 280px; height: 280px;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.7);
  transform-origin: bottom right;
  transition: opacity .22s ease, transform .22s ease;
}
.wheelSvg.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.wheelSector {
  cursor: pointer;
}
.wheelSector .wFill {
  transition: opacity .15s;
  opacity: 0.82;
}
.wheelSector:active .wFill { opacity: 1; }

.wheelLabel {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  fill: rgba(0,255,255,0.9);
  pointer-events: none;
  text-anchor: middle;
}
.wIcon {
  font-size: 16px;
}
.wText {
  font-size: 8px;
  letter-spacing: 1.5px;
  fill: rgba(200,240,255,0.75);
}

/* ===== MENU TOGGLE ===== */
.menuToggle {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 56px; height: 56px;
  border-radius: 14px;
  background: #0a1520;
  color: var(--cyan);
  font-size: 22px;
  border: 1px solid #0e2a3a;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 60;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow .2s, transform .2s;
}

.menuToggle:hover { box-shadow: 0 0 28px rgba(0,255,255,0.35); }
.menuToggle.open  { transform: rotate(45deg); box-shadow: 0 0 28px rgba(0,255,255,0.5); }

/* ===== PLAYER SIDES ===== */
.player {
  flex: 1;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  transition: box-shadow .2s;
  z-index: 1;
}

.left {
  background: linear-gradient(135deg, #060f1a 0%, #020609 100%);
  border-right: 1px solid #0e2a3a;
}

.right {
  background: linear-gradient(225deg, #1a0608 0%, #020609 100%);
}

.left.active  { box-shadow: inset 0 0 100px rgba(0,255,255,0.2); }
.right.active { box-shadow: inset 0 0 100px rgba(255,34,68,0.2); }

/* ===== SCORE NUMBER ===== */
.score {
  font-family: 'Orbitron', monospace;
  font-size: clamp(100px, 18vw, 160px);
  font-weight: 900;
  cursor: pointer;
  letter-spacing: -4px;
  line-height: 1;
  transition: transform .1s;
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
}

.left  .score { color: var(--cyan); text-shadow: 0 0 40px rgba(0,255,255,0.5); left: 25%; transform: translateY(-50%) translateX(-50%); }
.right .score { color: var(--red);  text-shadow: 0 0 40px rgba(255,34,68,0.5); right: 25%; transform: translateY(-50%) translateX(50%); }

.score:active { transform: translateY(-50%) translateX(-50%) scale(0.93); }
.right .score:active { transform: translateY(-50%) translateX(50%) scale(0.93); }

/* ===== PLAYER INFO (po QR scan) ===== */
.playerInfo {
  position: absolute;
  top: 16px;
  font-size: 16px;
  font-weight: 600;
  max-width: 42%;
  line-height: 1.3;
  z-index: 5;
}

.playerInfo .nick {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 2px;
}

.playerInfo.leftAlign  { left: 16px;  text-align: left; }
.playerInfo.rightAlign { right: 16px; text-align: right; }

.left  .playerInfo { color: var(--cyan); }
.right .playerInfo { color: var(--red); }

.playerInfo .bey {
  font-size: 12px;
  opacity: 0.6;
  letter-spacing: 1px;
}

/* ===== CENTER DRAG BUTTONS ===== */
.center {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  gap: 32px;
  z-index: 10;
}

.dragBtn {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 22px 32px;
  border-radius: 16px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
  touch-action: none;
  cursor: grab;
  transition: box-shadow .2s;
  text-align: center;
}

.dragBtn:hover { box-shadow: 0 0 30px rgba(0,255,255,0.25); }
.dragBtn.active {
  box-shadow: 0 0 40px rgba(255,34,68,0.5);
  border-color: var(--red);
  color: white;
}

/* ===== DRAG ARROWS ===== */
.dragWrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arrowGroup {
  position: absolute;
  display: flex;
  pointer-events: none;
  line-height: 1;
}

.leftArrow  { right: calc(100% + 8px); animation: arrowLeft  1.8s ease-in-out infinite; }
.rightArrow { left:  calc(100% + 8px); animation: arrowRight 1.8s ease-in-out infinite; }

.arrowGroup span {
  font-size: 72px;
  font-weight: 900;
}
.leftArrow  span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.leftArrow  span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }
.rightArrow span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.rightArrow span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }

@keyframes arrowLeft {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(-14px); opacity: 1; }
}

@keyframes arrowRight {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(14px);  opacity: 1; }
}

.arrowGroup.hidden { animation: none; opacity: 0; transition: opacity .4s; }

/* ===== RESET BUTTON ===== */
.resetBtn {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #1a0608;
  border: 1px solid rgba(255,34,68,0.3);
  color: var(--red);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  box-shadow: 0 0 18px rgba(255,34,68,0.25);
  touch-action: none;
  cursor: grab;
  z-index: 25;
  transition: box-shadow .2s;
}

.resetBtn .drag-label {
  font-family: 'Orbitron', monospace;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 1.5px;
  opacity: 0.55;
  line-height: 1;
}

.resetBtn .reset-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
}

.screenReset {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 150px rgba(255,34,68,0.4);
  opacity: 0;
  transition: opacity .2s;
  z-index: 40;
}

.screenReset.active { opacity: 1; }

/* ===== WAKE BUTTON ===== */
.wakeBtn {
  position: fixed;
  bottom: 20px; right: 86px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 35;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .3s;
}

.wake-progress {
  position: absolute;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  top: 0; left: 0;
  pointer-events: none;
}

.wake-progress circle {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 4;
  stroke-dasharray: 163;
  stroke-dashoffset: 163;
  transition: none;
}

.wakeBtn.cooldown { box-shadow: 0 0 20px rgba(255,34,68,0.4); border-color: rgba(255,34,68,0.3); }
.wakeBtn.active-wake { box-shadow: 0 0 24px rgba(0,255,255,0.4); }

/* ===== BEYBLADE SPINNER ===== */
.beyblade-icon {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  opacity: 0.75;
  transition: opacity .3s;
}

.beyblade-svg {
  width: 30px;
  height: 30px;
  filter: drop-shadow(0 0 3px rgba(0,255,255,0.4));
}

.wakeBtn.active-wake .beyblade-icon {
  opacity: 1;
  color: var(--cyan);
}

.wakeBtn.cooldown .beyblade-icon {
  color: var(--red);
  filter: drop-shadow(0 0 6px rgba(255,34,68,0.6));
}

/* ===== QR SCAN BUTTON ===== */
.scanBtn {
  position: absolute;
  top: 16px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 16px rgba(0,255,255,0.15);
  z-index: 15;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.6);
  transition: opacity .3s, transform .3s, box-shadow .2s;
}

.scanBtn:hover { box-shadow: 0 0 26px rgba(0,255,255,0.3); }
.scanBtn.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.scanBtn.hidden  { opacity: 0; pointer-events: none; transform: scale(0.6); }

#left  .scanBtn { left: 50%; transform-origin: center; }
#right .scanBtn { right: 50%; }

/* ===== QR OVERLAY ===== */
.qrOverlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,9,0.97);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 200;
  backdrop-filter: blur(10px);
}

.qrOverlay.hidden { display: none; }

#qrReader { width: 300px; border-radius: 12px; overflow: hidden; }

.qrResult {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--cyan);
  text-align: center;
  max-width: 300px;
  word-break: break-all;
  min-height: 40px;
  padding: 10px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  border-radius: 8px;
  width: 300px;
}

.qr-source-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.qr-tab {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(0,255,255,0.2);
  background: #0a1520;
  color: rgba(0,255,255,0.4);
  cursor: pointer;
  transition: all .2s;
}

.qr-tab.active {
  color: var(--cyan);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  box-shadow: 0 0 14px rgba(0,255,255,0.2);
}

.gallery-pick {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 10px;
  border: 1px solid rgba(0,255,255,0.25);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  cursor: pointer;
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
  transition: all .2s;
}

.gallery-pick:hover { box-shadow: 0 0 24px rgba(0,255,255,0.3); }
.gallery-pick.hidden { display: none; }

.qr-label {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--cyan);
  margin-bottom: 8px;
}

.qr-actions {
  display: flex;
  gap: 12px;
}

.qr-btn {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: all .2s;
}

.qr-btn.confirm {
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  border: 1px solid rgba(0,255,255,0.2);
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
}

.qr-btn.cancel {
  background: #0a1520;
  color: var(--red);
  border: 1px solid rgba(255,34,68,0.2);
}

.qr-btn.cancel:hover { box-shadow: 0 0 14px rgba(255,34,68,0.2); }

/* ===== WIN OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(2,6,9,0.88);
  opacity: 0;
  transition: opacity .3s;
  z-index: 100;
  pointer-events: none;
}

.overlay.show { opacity: 1; }

.overlay-text {
  font-family: 'Orbitron', monospace;
  font-size: clamp(40px, 8vw, 72px);
  font-weight: 900;
  letter-spacing: 4px;
  text-align: center;
}

.win   .overlay-text { color: var(--green); text-shadow: 0 0 60px var(--green); }
.xtreme .overlay-text { color: var(--red);  text-shadow: 0 0 60px var(--red); }

/* ===== SEND RESULT BUTTON ===== */
.sendResultBtn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 12px;
  background: linear-gradient(135deg, #001a0a, #002a12);
  color: var(--green);
  border: 1px solid rgba(0,255,157,0.25);
  box-shadow: 0 0 24px rgba(0,255,157,0.2);
  display: none;
  z-index: 50;
  cursor: pointer;
  transition: box-shadow .2s;
  white-space: nowrap;
}

.sendResultBtn:hover { box-shadow: 0 0 36px rgba(0,255,157,0.35); }
.sendResultBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-energy"></div>
<div id="screenReset" class="screenReset"></div>

<!-- WEAPON WHEEL -->
<div class="wheelBackdrop" id="wheelBackdrop" onclick="closeWheel()"></div>
<svg class="wheelSvg" id="wheelSvg" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Decorative rings from corner (280,280) -->
  <circle cx="280" cy="280" r="265" fill="none" stroke="rgba(0,255,255,0.08)" stroke-width="1"/>
  <circle cx="280" cy="280" r="170" fill="none" stroke="rgba(0,255,255,0.06)" stroke-width="1"/>
  <circle cx="280" cy="280" r="75"  fill="none" stroke="rgba(0,255,255,0.12)" stroke-width="1.5"/>

  <!-- ══ HLAVNÍ VIEW ══ -->
  <g id="wheelMain">
    <!-- FULL – slice 1 -->
    <g class="wheelSector" onclick="closeWheel();toggleFullscreen()">
      <path class="wFill"
        d="M 280.0,205.0 L 280.0,15.0 A 265,265 0 0,0 178.6,35.2 L 251.3,210.7 A 75,75 0 0,1 280.0,205.0 Z"
        fill="rgba(0,50,80,0.9)" stroke="rgba(0,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
      <text class="wheelLabel wIcon" x="246" y="100">⛶</text>
      <text class="wheelLabel wText" x="246" y="118">FULL</text>
    </g>

    <!-- ROTATE – slice 2 -->
    <g id="rotateSector" class="wheelSector" onclick="handleRotateClick()">
      <path class="wFill"
        d="M 251.3,210.7 L 178.6,35.2 A 265,265 0 0,0 92.6,92.6 L 227.0,227.0 A 75,75 0 0,1 251.3,210.7 Z"
        fill="rgba(0,35,65,0.9)" stroke="rgba(0,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
      <path id="rotateDisabledOverlay"
        d="M 251.3,210.7 L 178.6,35.2 A 265,265 0 0,0 92.6,92.6 L 227.0,227.0 A 75,75 0 0,1 251.3,210.7 Z"
        fill="rgba(0,0,0,0.55)" stroke="none" opacity="0" style="transition:opacity .2s;pointer-events:none"/>
      <text class="wheelLabel wIcon" x="183" y="128">⟳</text>
      <text class="wheelLabel wText" x="183" y="146">ROTATE</text>
    </g>

    <!-- SETTINGS – slice 3 -->
    <g class="wheelSector" onclick="openSettings()">
      <path class="wFill"
        d="M 227.0,227.0 L 92.6,92.6 A 265,265 0 0,0 35.2,178.6 L 210.7,251.3 A 75,75 0 0,1 227.0,227.0 Z"
        fill="rgba(0,22,52,0.9)" stroke="rgba(0,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
      <text class="wheelLabel wIcon" x="134" y="177">⚙</text>
      <text class="wheelLabel wText" x="134" y="195">SETTINGS</text>
    </g>

    <!-- REVERT – slice 4 -->
    <g class="wheelSector" onclick="closeWheel();revert()">
      <path class="wFill"
        d="M 210.7,251.3 L 35.2,178.6 A 265,265 0 0,0 15.0,280.0 L 205.0,280.0 A 75,75 0 0,1 210.7,251.3 Z"
        fill="rgba(0,12,40,0.9)" stroke="rgba(0,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
      <text class="wheelLabel wIcon" x="100" y="240">↩</text>
      <text class="wheelLabel wText" x="100" y="258">REVERT</text>
    </g>
  </g>

  <!-- ══ SETTINGS VIEW ══ -->
  <g id="wheelSettings" style="display:none">
    <!-- Výplň pozadí -->
    <path d="M 280,280 L 280,15 A 265,265 0 0,0 15,280 Z"
      fill="rgba(2,6,9,0.96)" stroke="rgba(0,255,255,0.12)" stroke-width="1"/>

    <!-- Slice 1: WIN hodnota – klepnutí zobrazí +/− -->
    <g class="wheelSector" onclick="toggleWinControls(event)">
      <path d="M 280.0,205.0 L 280.0,15.0 A 265,265 0 0,0 178.6,35.2 L 251.3,210.7 A 75,75 0 0,1 280.0,205.0 Z"
        fill="rgba(0,35,65,0.9)" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" stroke-linejoin="round"/>
      <text font-family="Orbitron,monospace" font-size="8" letter-spacing="2"
        fill="rgba(200,240,255,0.45)" text-anchor="middle" x="248" y="88">WIN SCORE</text>
      <text font-family="Orbitron,monospace" font-weight="900" font-size="40"
        fill="rgba(0,255,255,1)" text-anchor="middle" dominant-baseline="middle"
        x="248" y="118" id="settingsWinVal">7</text>
    </g>

    <!-- Slice 2: prázdné -->
    <path d="M 251.3,210.7 L 178.6,35.2 A 265,265 0 0,0 92.6,92.6 L 227.0,227.0 A 75,75 0 0,1 251.3,210.7 Z"
      fill="rgba(0,15,35,0.7)" stroke="rgba(0,255,255,0.1)" stroke-width="1" stroke-linejoin="round"/>

    <!-- Slice 3: VIBRACE toggle -->
    <g class="wheelSector" onclick="toggleVibrate()">
      <path d="M 227.0,227.0 L 92.6,92.6 A 265,265 0 0,0 35.2,178.6 L 210.7,251.3 A 75,75 0 0,1 227.0,227.0 Z"
        fill="rgba(0,22,52,0.9)" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" stroke-linejoin="round"/>
      <text font-family="Orbitron,monospace" font-size="8" letter-spacing="2"
        fill="rgba(200,240,255,0.55)" text-anchor="middle" x="134" y="174">VIBRACE</text>
      <rect id="vibratePillBg" x="108" y="186" width="52" height="22" rx="11"
        fill="rgba(0,0,0,0.5)" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
      <rect id="vibratePillFill" x="109" y="187" width="24" height="20" rx="10"
        fill="rgba(0,255,255,0.2)"/>
      <circle id="vibrateKnob" cx="121" cy="197" r="9" fill="rgba(0,255,255,0.9)"/>

<script>
// ═══════════════════════════════════════════════
const API = "https://script.google.com/macros/s/AKfycbzO8rgTmgJ55LUsDcP7lu2qXhA3Gt7IuLHYrjjiI06aHcxD2Lp7bP1gTcsNw3EtmgBt/exec"
// ═══════════════════════════════════════════════

/* ── STATE ── */
let score1 = 0, score2 = 0, winScore = 7
let history = []
let firstScoreUsed = false
let player1Name = "", player2Name = ""
let resultSent = false
let isLandscape = screen.orientation
  ? screen.orientation.type.startsWith("landscape")
  : window.innerWidth > window.innerHeight
let wakeActive = false
let cooldownTime = 30
let cooldownTimeout = null
let holdTimer = null

/* ── ELEMENTS ── */
const s1          = document.getElementById("score1")
const s2          = document.getElementById("score2")
const left        = document.getElementById("left")
const right       = document.getElementById("right")
const resetScreen = document.getElementById("screenReset")
const overlay     = document.getElementById("overlay")
const overlayText = document.getElementById("overlayText")
const wakeBtn     = document.getElementById("wakeBtn")
const circle      = wakeBtn.querySelector(".wake-progress circle")
const resetBtn    = document.getElementById("resetBtn")

/* ══════════════════════════════════════════════
   SCORE
══════════════════════════════════════════════ */
function addScore(p, pts) {
  if (!firstScoreUsed) {
    firstScoreUsed = true
    document.querySelectorAll(".arrowGroup").forEach(a => a.classList.add("hidden"))
  }

  let actual = pts
  if (p === 1) { const prev = score1; score1 = Math.min(score1 + pts, winScore); actual = score1 - prev; s1.innerText = score1 }
  if (p === 2) { const prev = score2; score2 = Math.min(score2 + pts, winScore); actual = score2 - prev; s2.innerText = score2 }
  history.push({ p, pts: actual })

  if (pts === 3) showOverlay("XTREME FINISH", "xtreme")
  if (score1 >= winScore) showOverlay(player1Name ? player1Name + " WINS" : "LEVÝ VÍTĚZ", "win")
  if (score2 >= winScore) showOverlay(player2Name ? player2Name + " WINS" : "PRAVÝ VÍTĚZ", "win")

  if (pts > 0) startCooldown()
  updateSendResultButton()
}

function subtractScore(p) {
  if (p === 1 && score1 > 0) addScore(1, -1)
  if (p === 2 && score2 > 0) addScore(2, -1)
}

function revert() {
  const h = history.pop()
  if (!h) return
  if (h.p === 1) { score1 -= h.pts; s1.innerText = score1 }
  if (h.p === 2) { score2 -= h.pts; s2.innerText = score2 }
}

let settingsOpen = false
let vibrateEnabled = true
let winControlsOpen = false

function openSettings() {
  settingsOpen = true
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelMain").style.display = "none"
  document.getElementById("wheelMainHub").style.display = "none"
  document.getElementById("wheelSettings").style.display = ""
  updateSettingsUI()
}

function closeSettings() {
  settingsOpen = false
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelSettings").style.display = "none"
  document.getElementById("wheelMain").style.display = ""
  document.getElementById("wheelMainHub").style.display = ""
}

function toggleWinControls(e) {
  e && e.stopPropagation()
  winControlsOpen = !winControlsOpen
  document.getElementById("winControls").style.display = winControlsOpen ? "" : "none"
}

function hideWinControls() {
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
}

function updateSettingsUI() {
  document.getElementById("settingsWinVal").textContent = winScore
  const on = vibrateEnabled
  // pill knob pozice pro nové souřadnice (pill x=108, šířka=52)
  document.getElementById("vibrateKnob").setAttribute("cx", on ? "151" : "121")
  document.getElementById("vibrateKnobText").setAttribute("x", on ? "151" : "121")
  document.getElementById("vibrateKnobText").textContent = on ? "ON" : "OFF"
  document.getElementById("vibratePillFill").setAttribute("x", on ? "133" : "109")
  document.getElementById("vibratePillFill").setAttribute("fill", on ? "rgba(0,255,255,0.25)" : "rgba(255,34,68,0.15)")
  document.getElementById("vibrateKnob").setAttribute("fill", on ? "rgba(0,255,255,0.9)" : "rgba(255,34,68,0.8)")
}

function changeWinDelta(delta) {
  const next = winScore + delta
  if (next < 1 || next > 99) return
  winScore = next
  document.getElementById("winScore") && (document.getElementById("winScore").innerText = winScore)
  document.getElementById("settingsWinVal").textContent = winScore
}

function toggleVibrate() {
  vibrateEnabled = !vibrateEnabled
  updateSettingsUI()
}

function changeWin() {
  const val = prompt("Počet bodů pro vítězství:", winScore)
  if (val !== null && !isNaN(val) && val > 0) {
    winScore = parseInt(val)
    document.getElementById("winScore") && (document.getElementById("winScore").innerText = winScore)
  }
}

/* ══════════════════════════════════════════════
   OVERLAY
══════════════════════════════════════════════ */
function showOverlay(text, cls) {
  overlayText.innerText = text
  overlay.className = "overlay show " + cls
  setTimeout(() => overlay.className = "overlay", 1400)
}

/* ══════════════════════════════════════════════
   RESET
══════════════════════════════════════════════ */
function resetScore() {
  score1 = score2 = 0
  history = []
  firstScoreUsed = false
  resultSent = false

  s1.innerText = "0"
  s2.innerText = "0"

  document.querySelectorAll(".arrowGroup").forEach(a => a.classList.remove("hidden"))
  resetPlayersInfo()
  startCooldown()
  updateSendResultButton()
}

function resetPlayersInfo() {
  player1Name = ""
  player2Name = ""

  ;["player1Info", "player2Info"].forEach(id => {
    const el = document.getElementById(id)
    el.innerHTML = ""
    el.className = "playerInfo"
  })

  document.querySelectorAll(".scanBtn").forEach(btn => {
    btn.classList.remove("hidden")
  })
}

/* DRAG RESET */
let rx = 0, ry = 0, dragReset = false
resetBtn.addEventListener("pointerdown", e => { dragReset = true; rx = e.clientX; ry = e.clientY })
resetBtn.addEventListener("pointermove", e => {
  if (!dragReset) return
  const dx = e.clientX - rx, dy = e.clientY - ry
  resetBtn.style.transform = `translate(${dx}px,${dy}px)`
  resetScreen.classList.toggle("active", dx > 80 || dy < -80)
})
resetBtn.addEventListener("pointerup", () => {
  resetBtn.style.transform = ""
  if (resetScreen.classList.contains("active")) resetScore()
  resetScreen.classList.remove("active")
  dragReset = false
})

/* ══════════════════════════════════════════════
   DRAG SCORE BUTTONS
══════════════════════════════════════════════ */
document.querySelectorAll(".dragBtn").forEach(b => {
  let sx = 0, dx = 0, dragging = false, hapticFired = false, hapticInterval = null

  b.addEventListener("pointerdown", e => {
    dragging = true
    hapticFired = false
    sx = e.clientX
    b.classList.add("active")
    b.setPointerCapture(e.pointerId)
  })

  b.addEventListener("pointermove", e => {
    if (!dragging) return
    dx = e.clientX - sx
    b.style.transform = `translateX(${dx}px)`
    left.classList.toggle("active",  dx < -80)
    right.classList.toggle("active", dx > 80)

    // Haptic v moment překročení prahu
    if (!hapticFired && (dx < -80 || dx > 80)) {
      hapticFired = true
      if (vibrateEnabled) {
        const pattern = [25,25,50,25,75,25,100,25,75,25,50,25,25]
        const total = pattern.reduce((a,b) => a+b, 0)
        navigator.vibrate?.(pattern)
        hapticInterval = setInterval(() => navigator.vibrate?.(pattern), total + 750)
      }
    }
    // Reset haptic pokud se vrátí zpět pod práh
    if (hapticFired && dx > -80 && dx < 80) {
      hapticFired = false
      clearInterval(hapticInterval)
      navigator.vibrate?.(0)
    }
  })

  b.addEventListener("pointerup", () => {
    b.style.transform = ""
    b.classList.remove("active")
    left.classList.remove("active")
    right.classList.remove("active")
    clearInterval(hapticInterval)
    navigator.vibrate?.(0)
    if (dx < -80) addScore(1, +b.dataset.points)
    if (dx > 80)  addScore(2, +b.dataset.points)
    dragging = false; dx = 0
  })
})

/* ══════════════════════════════════════════════
   WAKE BUTTON
══════════════════════════════════════════════ */
wakeBtn.addEventListener("pointerdown", e => {
  e.preventDefault()
  wakeBtn.setPointerCapture(e.pointerId)
  holdTimer = setTimeout(() => {
    const val = prompt("Cooldown v sekundách:", cooldownTime)
    if (val !== null && !isNaN(val) && val > 0) cooldownTime = parseInt(val)
  }, 2500)
})

wakeBtn.addEventListener("pointerup", () => {
  clearTimeout(holdTimer)
  if (!wakeActive) {
    wakeActive = true
    wakeBtn.classList.add("active-wake")
  }
  startCooldown()
})

wakeBtn.addEventListener("pointerleave", () => clearTimeout(holdTimer))

function startCooldown() {
  if (!wakeActive) return

  // Boost efekt při restartu cooldownu
  if (cooldownTimeout) {
    clearTimeout(cooldownTimeout)
    beySpeed = BEY_MAX * 1.2   // krátký kick navíc
  }

  cooldownStart = Date.now()

  wakeBtn.classList.add("cooldown")
  circle.style.transition = "none"
  circle.style.strokeDashoffset = "163"

  setTimeout(() => {
    circle.style.transition = `stroke-dashoffset ${cooldownTime}s linear`
    circle.style.strokeDashoffset = "0"
  }, 50)

  cooldownTimeout = setTimeout(() => {
    wakeBtn.classList.remove("cooldown")
    circle.style.transition = "none"
    circle.style.strokeDashoffset = "163"
    cooldownStart = null
    cooldownTimeout = null
  }, cooldownTime * 1000)
}

/* ── BEYBLADE PHYSICS SPINNER ── */
const beybladeEl = wakeBtn.querySelector(".beyblade-svg")
const BEY_MAX    = 13        // °/frame při 100% (≈ 2.2 rot/s @ 60fps)
let beyAngle     = 0
let beySpeed     = 0
let cooldownStart = null

;(function beyFrame() {
  requestAnimationFrame(beyFrame)

  let target = 0
  if (cooldownStart !== null) {
    const elapsed   = (Date.now() - cooldownStart) / 1000
    const fraction  = Math.max(0, 1 - elapsed / cooldownTime)
    target = BEY_MAX * fraction
  }

  // Plynulý přechod k cílové rychlosti
  // – při zpomalování: pomalý ease (fyzika)
  // – při zrychlení (boost): okamžitě přijme vyšší speed
  if (target < beySpeed) {
    beySpeed += (target - beySpeed) * 0.025   // pomalé dojíždění
  } else {
    beySpeed = Math.max(beySpeed, target)      // boost nastoupí hned
  }

  if (beySpeed > 0.05) {
    beyAngle = (beyAngle + beySpeed) % 360
    beybladeEl.style.transform = `rotate(${beyAngle}deg)`
  }
})()



/* ══════════════════════════════════════════════
   MENU
══════════════════════════════════════════════ */
const menuBtn = document.getElementById("menuToggle")
let menuHoldTimer = null
let scanVisible = false
let wheelOpen = false

menuBtn.addEventListener("pointerdown", () => {
  menuHoldTimer = setTimeout(() => toggleScanButtons(), 2500)
})
menuBtn.addEventListener("pointerup", () => {
  clearTimeout(menuHoldTimer)
  toggleWheel()
})
menuBtn.addEventListener("pointerleave", () => clearTimeout(menuHoldTimer))

function toggleWheel() {
  wheelOpen = !wheelOpen
  document.getElementById("wheelSvg").classList.toggle("open", wheelOpen)
  document.getElementById("wheelBackdrop").classList.toggle("open", wheelOpen)
  menuBtn.classList.toggle("open", wheelOpen)
  if (wheelOpen) {
    // vždy otevřít v hlavní nabídce
    closeSettings()
    updateRotateSector()
  }
}

function closeWheel() {
  wheelOpen = false
  document.getElementById("wheelSvg").classList.remove("open")
  document.getElementById("wheelBackdrop").classList.remove("open")
  menuBtn.classList.remove("open")
  if (settingsOpen) closeSettings()
}

function toggleScanButtons() {
  scanVisible = !scanVisible
  document.querySelectorAll(".scanBtn").forEach(btn => {
    btn.classList.toggle("visible", scanVisible)
  })
}

async function toggleFullscreen() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen()
    try { await screen.orientation.lock("landscape"); isLandscape = true } catch(e) {}
  } else {
    document.exitFullscreen()
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    isLandscape = screen.orientation
      ? screen.orientation.type.startsWith("landscape")
      : window.innerWidth > window.innerHeight
  }
  updateRotateSector()
})

// Detekce podpory orientation.lock (jen jednou při načtení)
const orientationLockSupported = !!(screen.orientation && screen.orientation.lock)

function updateRotateSector() {
  const canRotate = !!document.fullscreenElement && orientationLockSupported
  const sector  = document.getElementById("rotateSector")
  const overlay = document.getElementById("rotateDisabledOverlay")

  overlay.setAttribute("opacity", canRotate ? "0" : "1")
  sector.style.cursor = canRotate ? "pointer" : "not-allowed"
}

function handleRotateClick() {
  const canRotate = !!document.fullscreenElement && orientationLockSupported
  if (!canRotate) return
  closeWheel()
  rotateScreen()
}

async function rotateScreen() {
  try {
    await screen.orientation.lock(isLandscape ? "portrait" : "landscape")
    isLandscape = !isLandscape
  } catch(e) {
    // tiše selže
  }
}

/* ══════════════════════════════════════════════
   QR SCAN
══════════════════════════════════════════════ */
let currentPlayer = null
let qrScanner = null
let scannedQRText = ""
let qrMode = "camera"   // "camera" | "gallery"

function switchQRTab(mode) {
  qrMode = mode
  document.getElementById("tabCamera").classList.toggle("active",  mode === "camera")
  document.getElementById("tabGallery").classList.toggle("active", mode === "gallery")
  document.getElementById("qrReader").style.display      = mode === "camera"  ? "" : "none"
  document.getElementById("galleryPickBtn").classList.toggle("hidden", mode === "camera")

  if (mode === "gallery") {
    // zastav kameru pokud běžela
    if (qrScanner) qrScanner.stop().catch(() => {})
  } else {
    startCamera()
  }
}

function startCamera() {
  if (!qrScanner) qrScanner = new Html5Qrcode("qrReader")
  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    txt => {
      scannedQRText = txt
      document.getElementById("qrResult").innerText = txt
      qrScanner.stop()
    }
  ).catch(err => {
    document.getElementById("qrResult").innerText = "Kamera nedostupná: " + err
  })
}

async function handleQRFile(event) {
  const file = event.target.files[0]
  if (!file) return
  document.getElementById("qrResult").innerText = "Zpracovávám obrázek…"
  try {
    const scanner = new Html5Qrcode("qrReader")
    const txt = await scanner.scanFile(file, false)
    scannedQRText = txt
    document.getElementById("qrResult").innerText = txt
  } catch(e) {
    document.getElementById("qrResult").innerText = "QR kód nenalezen v obrázku"
  }
  // reset file inputu pro opakované použití
  event.target.value = ""
}

function scanPlayer(p) {
  currentPlayer = p
  scannedQRText = ""
  qrMode = "camera"
  document.getElementById("qrResult").innerText = "Naskenuj QR kód hráče…"
  document.getElementById("qrReader").style.display = ""
  document.getElementById("galleryPickBtn").classList.add("hidden")
  document.getElementById("tabCamera").classList.add("active")
  document.getElementById("tabGallery").classList.remove("active")
  document.getElementById("qrOverlay").classList.remove("hidden")

  qrScanner = new Html5Qrcode("qrReader")
  startCamera()
}

function confirmQR() {
  if (!scannedQRText) return alert("Žádná data – naskenuj QR kód")
  parseQR(currentPlayer, scannedQRText)
  closeQR()
}

function parseQR(player, text) {
  const nick = text.match(/Nick\s*[:\-]?\s*(.+)/i)
  const b1   = text.match(/Beyblade 1\s*[:\-]?\s*(.+)/i)
  const b2   = text.match(/Beyblade 2\s*[:\-]?\s*(.+)/i)
  const b3   = text.match(/Beyblade 3\s*[:\-]?\s*(.+)/i)

  const nickVal = nick ? nick[1].trim() : ""
  if (player === 1) player1Name = nickVal
  if (player === 2) player2Name = nickVal

  let html = ""
  if (nickVal) html += `<div class="nick">${nickVal}</div>`
  ;[b1, b2, b3].forEach(b => {
    if (b) html += `<div class="bey">${b[1].trim()}</div>`
  })

  const scanBtn = document.getElementById(player === 1 ? "scanBtn1" : "scanBtn2")
  if (scanBtn) scanBtn.classList.add("hidden")

  const infoEl = document.getElementById(player === 1 ? "player1Info" : "player2Info")
  infoEl.className = "playerInfo " + (player === 1 ? "leftAlign" : "rightAlign")
  infoEl.innerHTML = html

  updateSendResultButton()
}

function closeQR() {
  document.getElementById("qrOverlay").classList.add("hidden")
  if (qrScanner) { qrScanner.stop().catch(() => {}); qrScanner = null }
}

/* ══════════════════════════════════════════════
   SEND RESULT
══════════════════════════════════════════════ */
function updateSendResultButton() {
  const btn = document.getElementById("sendResultBtn")
  const canSend = player1Name && player2Name &&
    (score1 >= winScore || score2 >= winScore) &&
    !resultSent

  btn.style.display = canSend ? "block" : "none"
  btn.disabled = !canSend
}

function sendResult() {
  const btn = document.getElementById("sendResultBtn")
  btn.disabled = true
  btn.innerText = "⟳ ODESÍLÁM…"

  fetch(API, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "result",
      player1: player1Name,
      score1,
      player2: player2Name,
      score2,
      time: new Date().toISOString()
    })
  }).finally(() => {
    resultSent = true
    btn.style.display = "none"
    showOverlay("ODESLÁNO ✓", "win")
    updateSendResultButton()
  })
}

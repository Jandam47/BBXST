<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyblade X – Score Tracker</title>

<link rel="manifest" href="bbxst.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="vendor/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>

<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-user-select: none;
  user-select: none;
}

:root {
  --cyan:  #00ffff;
  --red:   #ff2244;
  --green: #00ff9d;
  --gold:  #ffd700;
  --bg:    #020609;
  --dim:   #2a4a58;
}

body {
  background: var(--bg);
  color: white;
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.bg-energy {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 120% 80% at 0% 50%, rgba(0,255,255,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 120% 80% at 100% 50%, rgba(255,34,68,0.07) 0%, transparent 55%);
  animation: breathe 8s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 1; }
}

/* ===== WEAPON WHEEL ===== */
/* Backdrop dismiss layer */
.wheelBackdrop {
  position: fixed;
  inset: 0;
  z-index: 49;
  display: none;
}
.wheelBackdrop.open { display: block; }

/* The SVG quarter-wheel anchored to bottom-right corner */
.wheelSvg {
  position: fixed;
  right: 0; bottom: 0;
  width: 280px; height: 280px;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.7);
  transform-origin: bottom right;
  transition: opacity .22s ease, transform .22s ease;
}
.wheelSvg.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.wheelSector {
  cursor: pointer;
}
.wheelSector .wFill {
  transition: opacity .15s;
  opacity: 0.82;
}
.wheelSector:active .wFill { opacity: 1; }

.wheelLabel {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  fill: rgba(0,255,255,0.9);
  pointer-events: none;
  text-anchor: middle;
}
.wIcon {
  font-size: 16px;
}
.wText {
  font-size: 7px;
  letter-spacing: 1.5px;
  fill: rgba(200,240,255,0.75);
}

/* ===== MENU TOGGLE ===== */
.menuToggle {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 56px; height: 56px;
  border-radius: 14px;
  background: #0a1520;
  color: var(--cyan);
  font-size: 22px;
  border: 1px solid #0e2a3a;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 60;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow .2s, transform .2s;
}

.menuToggle:hover { box-shadow: 0 0 28px rgba(0,255,255,0.35); }
.menuToggle.open  { transform: rotate(45deg); box-shadow: 0 0 28px rgba(0,255,255,0.5); }

/* ===== PLAYER SIDES ===== */
.player {
  flex: 1;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  transition: box-shadow .2s;
  z-index: 1;
}

.left {
  background: linear-gradient(135deg, #060f1a 0%, #020609 100%);
  border-right: 1px solid #0e2a3a;
}

.right {
  background: linear-gradient(225deg, #1a0608 0%, #020609 100%);
}

.left.active  { box-shadow: inset 0 0 100px rgba(0,255,255,0.2); }
.right.active { box-shadow: inset 0 0 100px rgba(255,34,68,0.2); }

/* ===== SCORE NUMBER ===== */
.score {
  font-family: 'Orbitron', monospace;
  font-size: clamp(100px, 18vw, 160px);
  font-weight: 900;
  cursor: pointer;
  letter-spacing: -4px;
  line-height: 1;
  transition: transform .1s;
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
}

.left  .score { color: var(--cyan); text-shadow: 0 0 40px rgba(0,255,255,0.5); left: 25%; transform: translateY(-50%) translateX(-50%); }
.right .score { color: var(--red);  text-shadow: 0 0 40px rgba(255,34,68,0.5); right: 25%; transform: translateY(-50%) translateX(50%); }

.score:active { transform: translateY(-50%) translateX(-50%) scale(0.93); }
.right .score:active { transform: translateY(-50%) translateX(50%) scale(0.93); }

/* ===== PLAYER INFO (po QR scan) ===== */
.playerInfo {
  position: absolute;
  top: 16px;
  font-size: 16px;
  font-weight: 600;
  max-width: 42%;
  line-height: 1.3;
  z-index: 5;
}

.playerInfo .nick {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 2px;
}

.playerInfo.leftAlign  { left: 16px;  text-align: left; }
.playerInfo.rightAlign { right: 16px; text-align: right; }

.left  .playerInfo { color: var(--cyan); }
.right .playerInfo { color: var(--red); }

.playerInfo .bey {
  font-size: 12px;
  opacity: 0.6;
  letter-spacing: 1px;
}

/* ===== CENTER DRAG BUTTONS ===== */
.center {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  gap: 32px;
  z-index: 10;
}

.dragBtn {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 22px 32px;
  border-radius: 16px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
  touch-action: none;
  cursor: grab;
  transition: box-shadow .2s;
  text-align: center;
}

.dragBtn:hover { box-shadow: 0 0 30px rgba(0,255,255,0.25); }
.dragBtn.active {
  box-shadow: 0 0 40px rgba(255,34,68,0.5);
  border-color: var(--red);
  color: white;
}

/* ===== DRAG ARROWS ===== */
.dragWrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arrowGroup {
  position: absolute;
  display: flex;
  pointer-events: none;
  line-height: 1;
}

.leftArrow  { right: calc(100% + 8px); animation: arrowLeft  1.8s ease-in-out infinite; }
.rightArrow { left:  calc(100% + 8px); animation: arrowRight 1.8s ease-in-out infinite; }

.arrowGroup span {
  font-size: 72px;
  font-weight: 900;
}
.leftArrow  span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.leftArrow  span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }
.rightArrow span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.rightArrow span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }

@keyframes arrowLeft {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(-14px); opacity: 1; }
}

@keyframes arrowRight {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(14px);  opacity: 1; }
}

.arrowGroup.hidden { animation: none; opacity: 0; transition: opacity .4s; }

/* ===== RESET BUTTON ===== */
.resetBtn {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #1a0608;
  border: 1px solid rgba(255,34,68,0.3);
  color: var(--red);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  box-shadow: 0 0 18px rgba(255,34,68,0.25);
  touch-action: none;
  cursor: grab;
  z-index: 25;
  transition: box-shadow .2s;
}

.resetBtn .drag-label {
  font-family: 'Orbitron', monospace;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 1.5px;
  opacity: 0.55;
  line-height: 1;
}

.resetBtn .reset-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
}

.screenReset {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 150px rgba(255,34,68,0.4);
  opacity: 0;
  transition: opacity .2s;
  z-index: 40;
}

.screenReset.active { opacity: 1; }

/* ===== WAKE BUTTON ===== */
.wakeBtn {
  position: fixed;
  bottom: 20px; right: 86px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 35;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .3s;
}

.wake-progress {
  position: absolute;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  top: 0; left: 0;
  pointer-events: none;
}

.wake-progress circle {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 4;
  stroke-dasharray: 163;
  stroke-dashoffset: 163;
  transition: none;
}

.wakeBtn.cooldown { box-shadow: 0 0 20px rgba(255,34,68,0.4); border-color: rgba(255,34,68,0.3); }
.wakeBtn.active-wake { box-shadow: 0 0 24px rgba(0,255,255,0.4); }

/* ===== BEYBLADE SPINNER ===== */
.beyblade-icon {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  opacity: 0.75;
  transition: opacity .3s;
}

.beyblade-svg {
  width: 30px;
  height: 30px;
  filter: drop-shadow(0 0 3px rgba(0,255,255,0.4));
}

.wakeBtn.active-wake .beyblade-icon {
  opacity: 1;
  color: var(--cyan);
}

.wakeBtn.cooldown .beyblade-icon {
  color: var(--red);
  filter: drop-shadow(0 0 6px rgba(255,34,68,0.6));
}

/* ===== QR SCAN BUTTON ===== */
.scanBtn {
  position: absolute;
  top: 16px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 16px rgba(0,255,255,0.15);
  z-index: 15;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.6);
  transition: opacity .3s, transform .3s, box-shadow .2s;
}

.scanBtn:hover { box-shadow: 0 0 26px rgba(0,255,255,0.3); }
.scanBtn.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.scanBtn.hidden  { opacity: 0; pointer-events: none; transform: scale(0.6); }

#left  .scanBtn { left: 50%; transform-origin: center; }
#right .scanBtn { right: 50%; }

/* ===== QR OVERLAY ===== */
.qrOverlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,9,0.97);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 200;
  backdrop-filter: blur(10px);
}

.qrOverlay.hidden { display: none; }

#qrReader { width: 300px; border-radius: 12px; overflow: hidden; }

.qrResult {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--cyan);
  text-align: center;
  max-width: 300px;
  word-break: break-all;
  min-height: 40px;
  padding: 10px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  border-radius: 8px;
  width: 300px;
}

.qr-source-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.qr-tab {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(0,255,255,0.2);
  background: #0a1520;
  color: rgba(0,255,255,0.4);
  cursor: pointer;
  transition: all .2s;
}

.qr-tab.active {
  color: var(--cyan);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  box-shadow: 0 0 14px rgba(0,255,255,0.2);
}

.gallery-pick {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 10px;
  border: 1px solid rgba(0,255,255,0.25);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  cursor: pointer;
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
  transition: all .2s;
}

.gallery-pick:hover { box-shadow: 0 0 24px rgba(0,255,255,0.3); }
.gallery-pick.hidden { display: none; }

.qr-label {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--cyan);
  margin-bottom: 8px;
}

.qr-actions {
  display: flex;
  gap: 12px;
}

.qr-btn {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: all .2s;
}

.qr-btn.confirm {
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  border: 1px solid rgba(0,255,255,0.2);
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
}

.qr-btn.cancel {
  background: #0a1520;
  color: var(--red);
  border: 1px solid rgba(255,34,68,0.2);
}

.qr-btn.cancel:hover { box-shadow: 0 0 14px rgba(255,34,68,0.2); }

/* ===== WIN OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(2,6,9,0.88);
  opacity: 0;
  transition: opacity .3s;
  z-index: 100;
  pointer-events: none;
}

.overlay.show { opacity: 1; }

.overlay-text {
  font-family: 'Orbitron', monospace;
  font-size: clamp(40px, 8vw, 72px);
  font-weight: 900;
  letter-spacing: 4px;
  text-align: center;
}

.win   .overlay-text { color: var(--green); text-shadow: 0 0 60px var(--green); }
.xtreme .overlay-text { color: var(--red);  text-shadow: 0 0 60px var(--red); }

/* ===== SEND RESULT BUTTON ===== */
.sendResultBtn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 12px;
  background: linear-gradient(135deg, #001a0a, #002a12);
  color: var(--green);
  border: 1px solid rgba(0,255,157,0.25);
  box-shadow: 0 0 24px rgba(0,255,157,0.2);
  display: none;
  z-index: 50;
  cursor: pointer;
  transition: box-shadow .2s;
  white-space: nowrap;
}

.sendResultBtn:hover { box-shadow: 0 0 36px rgba(0,255,157,0.35); }
.sendResultBtn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ═════════════ JUDGE MÓD ═════════════ */
/* tahací přepínač casual/judge – nad resetem */
.modeBtn {
  position: fixed; left: 20px; bottom: 96px;
  width: 64px; height: 64px; border-radius: 50%;
  background: #0a1520; border: 1px solid rgba(0,255,255,0.3); color: var(--cyan);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  box-shadow: 0 0 18px rgba(0,255,255,0.2); touch-action: none; cursor: grab; z-index: 25; transition: box-shadow .2s, border-color .2s, color .2s;
}
.modeBtn .drag-label { font-family: 'Orbitron', monospace; font-size: 7px; font-weight: 700; letter-spacing: 1.5px; opacity: .55; line-height: 1; }
.modeBtn .mode-label { font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; line-height: 1; }
body.judge .modeBtn { color: var(--gold); border-color: rgba(255,215,0,0.45); box-shadow: 0 0 22px rgba(255,215,0,0.3); background: #1a1500; }
.screenMode { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 150px rgba(255,215,0,0.35); opacity: 0; transition: opacity .2s; z-index: 40; }
.screenMode.active { opacity: 1; }

/* lišta judge – dole mezi rohovými tlačítky, mimo tahací tlačítka */
.judgeBar {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: none; flex-direction: row; align-items: center; gap: 8px; z-index: 30;
  max-width: calc(100vw - 320px); min-width: 0;
}
@media (max-width: 700px) { .judgeBar { max-width: calc(100vw - 180px); flex-wrap: wrap; justify-content: center; } }
body.judge .judgeBar { display: flex; }
.judgeTag { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; color: var(--gold);
  padding: 4px 10px; border: 1px solid rgba(255,215,0,0.35); border-radius: 20px; background: rgba(26,21,0,0.85); white-space: nowrap; }
.judgeInfo { font-size: 14px; font-weight: 600; color: rgba(200,240,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.judgeBtn { flex: none; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 1.5px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  background: #0a1520; color: var(--cyan); border: 1px solid rgba(0,255,255,0.25); box-shadow: 0 0 12px rgba(0,255,255,0.12); }
.judgeBtn.gold { color: var(--gold); border-color: rgba(255,215,0,0.4); }

/* beyblady hráče v judge módu */
.playerInfo .bey.used { opacity: .25; text-decoration: line-through; }
.playerInfo .bey.last { opacity: 1; color: white; }

/* remíza – jen s načteným zápasem */
.judgeBar .drawBtn { display: none; }
body.judge.has-match .judgeBar .drawBtn { display: block; }

/* výběr beyů po bodu */
.pickOverlay { position: fixed; inset: 0; z-index: 210; background: rgba(2,6,9,0.94); backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.pickOverlay.hidden { display: none; }
.pickTitle { font-family: 'Orbitron', monospace; font-size: clamp(14px, 2.4vw, 20px); letter-spacing: 3px; color: white; text-align: center; }
.pickTitle .pts { color: var(--gold); }
.pickCols { display: flex; gap: clamp(12px, 3vw, 40px); width: min(920px, 100%); }
.pickCol { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; border: 1px solid #0e2a3a; transition: border-color .2s, box-shadow .2s; }
.pickCol h4 { font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 2px; text-align: center; }
.pickCol.left h4 { color: var(--cyan); } .pickCol.right h4 { color: var(--red); }
.pickCol .hint { font-size: 12px; text-align: center; color: rgba(200,240,255,0.5); min-height: 15px; }
.pickCol.turn { border-color: rgba(255,215,0,0.6); box-shadow: 0 0 24px rgba(255,215,0,0.15); }
.beyPick { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(16px, 2.4vw, 22px); padding: 14px 12px; border-radius: 12px; cursor: pointer;
  background: #0a1520; color: white; border: 1px solid #1a3a4a; transition: all .15s; }
.beyPick:disabled { opacity: .25; cursor: not-allowed; }
.beyPick.win  { background: rgba(0,255,157,0.18); border-color: var(--green); color: var(--green); box-shadow: 0 0 18px rgba(0,255,157,0.3); }
.beyPick.lose { background: rgba(255,34,68,0.16); border-color: var(--red); color: #ffb3c0; }

/* prohození stran (jen při 0:0) */
.swapBtn { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30; display: none;
  width: 64px; height: 44px; border-radius: 12px; cursor: pointer; align-items: center; justify-content: center;
  background: #0a1520; border: 1px solid rgba(255,215,0,0.4); box-shadow: 0 0 16px rgba(255,215,0,0.15); }
.swapBtn svg { width: 40px; height: 24px; }
body.judge.has-match.can-swap .swapBtn { display: flex; }
.swapBtn:active { transform: translateX(-50%) scale(.92); }
.judgeTag { cursor: pointer; }
.rotate .overlay-text { color: var(--gold); text-shadow: 0 0 60px var(--gold); }

/* judge dialogy (ruční zápas, chyby) */
.jOverlay { position: fixed; inset: 0; z-index: 220; background: rgba(2,6,9,0.96); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.jOverlay.hidden { display: none; }
.jBox { width: min(560px, 100%); max-height: 92vh; overflow-y: auto; background: #061018; border: 1px solid #0e2a3a; border-radius: 16px; padding: 18px; }

.jMatch .meta { font-size: 13px; color: rgba(200,240,255,0.55); }
.jBox a { color: var(--cyan); }
</style>

<script>

/* ── STATE ── */
let score1 = 0, score2 = 0, winScore = 7
let history = []
let firstScoreUsed = false
let player1Name = "", player2Name = ""
let resultSent = false
let isLandscape = screen.orientation
  ? screen.orientation.type.startsWith("landscape")
  : window.innerWidth > window.innerHeight
let wakeActive = false
let cooldownTime = 30
let cooldownTimeout = null
let holdTimer = null

/* ── ELEMENTS ── */
const s1          = document.getElementById("score1")
const s2          = document.getElementById("score2")
const left        = document.getElementById("left")
const right       = document.getElementById("right")
const resetScreen = document.getElementById("screenReset")
const overlay     = document.getElementById("overlay")
const overlayText = document.getElementById("overlayText")
const wakeBtn     = document.getElementById("wakeBtn")
const circle      = wakeBtn.querySelector(".wake-progress circle")
const resetBtn    = document.getElementById("resetBtn")

/* ══════════════════════════════════════════════
   SCORE
══════════════════════════════════════════════ */
let matchOver = false

function updateMatchState() {
  matchOver = score1 >= winScore || score2 >= winScore
}

function addScore(p, pts, battle) {
  // Po skončení zápasu už nejde přidávat, jen ubírat / revert
  if (matchOver && pts > 0) return

  if (!firstScoreUsed) {
    firstScoreUsed = true
    document.querySelectorAll(".arrowGroup").forEach(a => a.classList.add("hidden"))
  }

  let actual = pts
  if (p === 1) { const prev = score1; score1 = Math.max(0, Math.min(score1 + pts, winScore)); actual = score1 - prev; s1.innerText = score1 }
  if (p === 2) { const prev = score2; score2 = Math.max(0, Math.min(score2 + pts, winScore)); actual = score2 - prev; s2.innerText = score2 }
  if (actual === 0) return
  if (battle) { battle.pts = actual; judge.battles.push(battle) }
  history.push({ p, pts: actual, battle: !!battle })

  updateMatchState()

  if (pts > 0) {
    // Výhru vyhodnocuj jen u hráče, který právě skóroval
    const won = (p === 1 ? score1 : score2) >= winScore
    const name = p === 1 ? player1Name : player2Name
    const winText = name ? name + " WINS" : (p === 1 ? "LEVÝ VÍTĚZ" : "PRAVÝ VÍTĚZ")

    const queue = []
    if (pts === 3) queue.push(["XTREME FINISH", "xtreme"])
    if (won)       queue.push([winText, "win"])
    else if (battle && judge.battles.length % 3 === 0) { queue.push(["OTOČ ARÉNU", "rotate"]); if (vibrateEnabled) navigator.vibrate?.([120, 80, 120]) }
    if (queue.length) showOverlaySequence(queue)

    startCooldown()
  }

  updateSendResultButton()
}

function subtractScore(p) {
  if (judgeHasMatch()) return showOverlay("V JUDGE MÓDU POUŽIJ REVERT", "xtreme")
  if (p === 1 && score1 > 0) addScore(1, -1)
  if (p === 2 && score2 > 0) addScore(2, -1)
}

function revert() {
  const h = history.pop()
  if (!h) return
  if (h.battle) { judge.battles.pop(); renderJudgePlayers() }   // judge: zahoď i zápis souboje (vč. remízy)
  if (h.p === 1) { score1 -= h.pts; s1.innerText = score1 }
  if (h.p === 2) { score2 -= h.pts; s2.innerText = score2 }
  updateMatchState()
  updateSendResultButton()
}

let settingsOpen = false
let vibrateEnabled = true
let winControlsOpen = false

function openSettings() {
  settingsOpen = true
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelMain").style.display = "none"
  document.getElementById("wheelMainHub").style.display = "none"
  document.getElementById("wheelSettings").style.display = ""
  updateSettingsUI()
}

function closeSettings() {
  settingsOpen = false
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelSettings").style.display = "none"
  document.getElementById("wheelMain").style.display = ""
  document.getElementById("wheelMainHub").style.display = ""
}

function toggleWinControls(e) {
  e && e.stopPropagation()
  winControlsOpen = !winControlsOpen
  document.getElementById("winControls").style.display = winControlsOpen ? "" : "none"
}

function hideWinControls() {
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
}

function updateSettingsUI() {
  document.getElementById("settingsWinVal").textContent = winScore
  const on = vibrateEnabled
  // pill knob pozice pro nové souřadnice (pill x=108, šířka=52)
  document.getElementById("vibrateKnob").setAttribute("cx", on ? "151" : "121")
  document.getElementById("vibrateKnobText").setAttribute("x", on ? "151" : "121")
  document.getElementById("vibrateKnobText").textContent = on ? "ON" : "OFF"
  document.getElementById("vibratePillFill").setAttribute("x", on ? "133" : "109")
  document.getElementById("vibratePillFill").setAttribute("fill", on ? "rgba(0,255,255,0.25)" : "rgba(255,34,68,0.15)")
  document.getElementById("vibrateKnob").setAttribute("fill", on ? "rgba(0,255,255,0.9)" : "rgba(255,34,68,0.8)")
}

function changeWinDelta(delta) {
  if (judgeHasMatch()) return showOverlay("V JUDGE MÓDU URČUJE BODY TURNAJ", "xtreme")
  const next = winScore + delta
  if (next < 1 || next > 99) return
  winScore = next
  document.getElementById("settingsWinVal").textContent = winScore
  updateMatchState()
  updateSendResultButton()
}

function toggleVibrate() {
  vibrateEnabled = !vibrateEnabled
  updateSettingsUI()
}

/* ══════════════════════════════════════════════
   OVERLAY
══════════════════════════════════════════════ */
const OVERLAY_MS = 1400
let overlayTimers = []

// Zobrazí hlášky postupně za sebou; nová sekvence zruší tu předchozí
function showOverlaySequence(items) {
  overlayTimers.forEach(clearTimeout)
  overlayTimers = []
  items.forEach(([text, cls], i) => {
    overlayTimers.push(setTimeout(() => {
      overlayText.innerText = text
      overlay.className = "overlay show " + cls
    }, i * OVERLAY_MS))
  })
  overlayTimers.push(setTimeout(() => overlay.className = "overlay", items.length * OVERLAY_MS))
}

function showOverlay(text, cls) {
  showOverlaySequence([[text, cls]])
}

/* ══════════════════════════════════════════════
   RESET
   – někdo má body  → vynuluje jen skóre (hráči zůstanou)
   – oba mají 0     → odhlásí i naskenované hráče
══════════════════════════════════════════════ */
function resetScore() {
  const clearPlayers = score1 === 0 && score2 === 0

/* ══════════════════════════════════════════════
   DRAG SCORE BUTTONS
══════════════════════════════════════════════ */
document.querySelectorAll(".dragBtn").forEach(b => {
  let sx = 0, dx = 0, dragging = false, hapticFired = false, hapticInterval = null

  b.addEventListener("pointerdown", e => {
    dragging = true
    hapticFired = false
    sx = e.clientX
    b.classList.add("active")
    b.setPointerCapture(e.pointerId)
  })

  b.addEventListener("pointermove", e => {
    if (!dragging) return
    dx = e.clientX - sx
    b.style.transform = `translateX(${dx}px)`
    left.classList.toggle("active",  dx < -80)
    right.classList.toggle("active", dx > 80)

    // Haptic v moment překročení prahu
    if (!hapticFired && (dx < -80 || dx > 80)) {
      hapticFired = true
      if (vibrateEnabled) {
        const pattern = [25,25,50,25,75,25,100,25,75,25,50,25,25]
        const total = pattern.reduce((a,b) => a+b, 0)
        navigator.vibrate?.(pattern)
        hapticInterval = setInterval(() => navigator.vibrate?.(pattern), total + 750)
      }
    }
    // Reset haptic pokud se vrátí zpět pod práh
    if (hapticFired && dx > -80 && dx < 80) {
      hapticFired = false
      clearInterval(hapticInterval)
      navigator.vibrate?.(0)
    }
  })

  function endDrag(commit) {
    if (!dragging) return
    b.style.transform = ""
    b.classList.remove("active")
    left.classList.remove("active")
    right.classList.remove("active")
    clearInterval(hapticInterval)
    hapticInterval = null
    navigator.vibrate?.(0)
    if (commit) {
      if (dx < -80) scoreFromDrag(1, +b.dataset.points)
      if (dx > 80)  scoreFromDrag(2, +b.dataset.points)
    }
    dragging = false; dx = 0
  }

  b.addEventListener("pointerup",     () => endDrag(true))
  // Systém gesto přerušil (notifikace, gesto od kraje…) → nic nezapisovat, zastavit vibrace
  b.addEventListener("pointercancel", () => endDrag(false))
})

/* ── SCREEN WAKE LOCK – displej nezhasne, dokud je WAKE aktivní ── */
let wakeLock = null
async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return
  try {
    wakeLock = await navigator.wakeLock.request("screen")
    wakeLock.addEventListener("release", () => { wakeLock = null })
  } catch (e) { wakeLock = null }
}
// Prohlížeč zámek uvolní při přepnutí aplikace → po návratu ho obnov
document.addEventListener("visibilitychange", () => {
  if (wakeActive && document.visibilityState === "visible") requestWakeLock()
})

function startCooldown() {
  if (!wakeActive) return

  // Boost efekt při restartu cooldownu
  if (cooldownTimeout) {
    clearTimeout(cooldownTimeout)
    beySpeed = BEY_MAX * 1.2   // krátký kick navíc
  }

  cooldownStart = Date.now()

  wakeBtn.classList.add("cooldown")
  circle.style.transition = "none"
  circle.style.strokeDashoffset = "163"

  setTimeout(() => {
    circle.style.transition = `stroke-dashoffset ${cooldownTime}s linear`
    circle.style.strokeDashoffset = "0"
  }, 50)

  cooldownTimeout = setTimeout(() => {
    wakeBtn.classList.remove("cooldown")
    circle.style.transition = "none"
    circle.style.strokeDashoffset = "163"
    cooldownStart = null
    cooldownTimeout = null
  }, cooldownTime * 1000)
}

/* ── BEYBLADE PHYSICS SPINNER ── */
const beybladeEl = wakeBtn.querySelector(".beyblade-svg")
const BEY_MAX    = 13        // °/frame při 100% (≈ 2.2 rot/s @ 60fps)
let beyAngle     = 0
let beySpeed     = 0
let cooldownStart = null

;(function beyFrame() {
  requestAnimationFrame(beyFrame)

  let target = 0
  if (cooldownStart !== null) {
    const elapsed   = (Date.now() - cooldownStart) / 1000
    const fraction  = Math.max(0, 1 - elapsed / cooldownTime)
    target = BEY_MAX * fraction
  }

  // Plynulý přechod k cílové rychlosti
  // – při zpomalování: pomalý ease (fyzika)
  // – při zrychlení (boost): okamžitě přijme vyšší speed
  if (target < beySpeed) {
    beySpeed += (target - beySpeed) * 0.025   // pomalé dojíždění
  } else {
    beySpeed = Math.max(beySpeed, target)      // boost nastoupí hned
  }

  if (beySpeed > 0.05) {
    beyAngle = (beyAngle + beySpeed) % 360
    beybladeEl.style.transform = `rotate(${beyAngle}deg)`
  }
})()

let currentPlayer = null
let qrScanner = null
let scannedQRText = ""
let qrMode = "camera"   // "camera" | "gallery"

function switchQRTab(mode) {
  qrMode = mode
  document.getElementById("tabCamera").classList.toggle("active",  mode === "camera")
  document.getElementById("tabGallery").classList.toggle("active", mode === "gallery")
  document.getElementById("qrReader").style.display      = mode === "camera"  ? "" : "none"
  document.getElementById("galleryPickBtn").classList.toggle("hidden", mode === "camera")

  if (mode === "gallery") {
    // zastav kameru pokud běžela
    stopScanner()
  } else {
    startCamera()
  }
}

// Bezpečné zastavení – stop() na neběžícím skeneru by vyhodil chybu
async function stopScanner() {
  if (qrScanner && qrScanner.isScanning) {
    try { await qrScanner.stop() } catch (e) {}
  }
}

async function startCamera() {
  if (!qrScanner) qrScanner = new Html5Qrcode("qrReader")
  if (qrScanner.isScanning) return
  try {
    await qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      txt => {
        scannedQRText = txt
        document.getElementById("qrResult").innerText = txt
        stopScanner()
      }
    )
  } catch (err) {
    document.getElementById("qrResult").innerText = "Kamera nedostupná: " + err
  }
}

async function handleQRFile(event) {
  const file = event.target.files[0]
  if (!file) return
  document.getElementById("qrResult").innerText = "Zpracovávám obrázek…"
  try {
    await stopScanner()
    if (!qrScanner) qrScanner = new Html5Qrcode("qrReader")
    const txt = await qrScanner.scanFile(file, false)
    scannedQRText = txt
    document.getElementById("qrResult").innerText = txt
  } catch(e) {
    document.getElementById("qrResult").innerText = "QR kód nenalezen v obrázku"
  }
  // reset file inputu pro opakované použití
  event.target.value = ""
}

function scanPlayer(p) {
  currentPlayer = p
  scannedQRText = ""
  qrMode = "camera"
  document.getElementById("qrResult").innerText = "Naskenuj QR kód hráče…"
  document.getElementById("qrReader").style.display = ""
  document.getElementById("galleryPickBtn").classList.add("hidden")
  document.getElementById("tabCamera").classList.add("active")
  document.getElementById("tabGallery").classList.remove("active")
  document.getElementById("qrOverlay").classList.remove("hidden")

  startCamera()
}

function confirmQR() {
  if (!scannedQRText) return alert("Žádná data – naskenuj QR kód")
  const side = currentPlayer, text = scannedQRText
  closeQR()
  if (judgeMode) judgeScan(side, text)
  else parseQR(side, text)
}

function parseQR(player, text) {
  const nick = text.match(/Nick\s*[:\-]?\s*(.+)/i)
  const b1   = text.match(/Beyblade 1\s*[:\-]?\s*(.+)/i)
  const b2   = text.match(/Beyblade 2\s*[:\-]?\s*(.+)/i)
  const b3   = text.match(/Beyblade 3\s*[:\-]?\s*(.+)/i)

  const nickVal = nick ? nick[1].trim() : ""
  if (player === 1) player1Name = nickVal
  if (player === 2) player2Name = nickVal

  const scanBtn = document.getElementById(player === 1 ? "scanBtn1" : "scanBtn2")
  if (scanBtn) scanBtn.classList.add("hidden")

  const infoEl = document.getElementById(player === 1 ? "player1Info" : "player2Info")
  infoEl.className = "playerInfo " + (player === 1 ? "leftAlign" : "rightAlign")

  // Obsah QR se vkládá jako text, ne HTML (ochrana proti podstrčenému kódu)
  infoEl.replaceChildren()
  const addLine = (cls, txt) => {
    const div = document.createElement("div")
    div.className = cls
    div.textContent = txt
    infoEl.appendChild(div)
  }
  if (nickVal) addLine("nick", nickVal)
  ;[b1, b2, b3].forEach(b => { if (b) addLine("bey", b[1].trim()) })

  updateSendResultButton()
}

function closeQR() {
  document.getElementById("qrOverlay").classList.add("hidden")
  stopScanner()
}

/* ══════════════════════════════════════════════
   JUDGE MÓD – napojení na BBXU (Supabase)
   casual (výchozí) = obyčejné počítadlo bez odesílání
   judge            = QR / ruční výběr zápasu, zápis beyů, odeslání výsledku
══════════════════════════════════════════════ */
const CFG = window.BBX_CONFIG || {}
const BBXU_URL = "./index.html"
const SB_OK = !!(window.supabase && CFG.supabaseUrl && !CFG.supabaseUrl.includes("SEM-VLOZ"))
const sb = SB_OK ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } }) : null
const JUDGE_ROLES = ["judge", "organizer", "admin", "superadmin"]
const ME_KEY = "bbxst_judge_me"
const PENDING_KEY = "bbxst_judge_pending"

let judgeMode = false
const judge = {
  me: null,
  sides: { 1: null, 2: null },   // strana stolu → { reg, nick, beys[], tournament_id, tournament_name }
  match: null,                     // zápas z BBXU
  leftSlot: 1,                     // levá strana = p1 (1) nebo p2 (2) v databázi
  battles: [],                     // { slot: 0|1|2 (strana stolu), pts, beys: {1: …, 2: …} }
  startedAt: null,
}
const judgeHasMatch = () => judgeMode && !!judge.match
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const isNetErr = (e) => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message || String(e))

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args)
  if (error) throw error
  return data
}

async function enterJudge(silent) {
  if (!sb) { jAlert("Judge mód potřebuje propojení s BBXU – vyplň <b>js/config.js</b>."); return false }
  const { data: { session } } = await sb.auth.getSession()
  if (!session || session.user.is_anonymous) {
    jAlert(`Pro judge mód se přihlas v <a href="${BBXU_URL}#/login">BBXU</a> účtem s funkcí Judge.<br>Na stejném zařízení pak budeš přihlášený i tady.`)
    return false
  }
  let me = null
  try {
    const { data, error } = await sb.from("profiles").select("id, nick, role").eq("id", session.user.id).single()
    if (error) throw error
    me = data
    localStorage.setItem(ME_KEY, JSON.stringify(me))
  } catch (e) {
    // bez sítě vezmi poslední ověřenou roli
    try { me = JSON.parse(localStorage.getItem(ME_KEY)) } catch {}
    if (!me || me.id !== session.user.id) { jAlert("Nepodařilo se ověřit účet: " + esc(e.message || e)); return false }
  }
  if (!JUDGE_ROLES.includes(me.role)) {
    jAlert(`Účet <b>${esc(me.nick)}</b> nemá funkci Judge. Přidělí ti ji admin v BBXU.`)
    return false
  }
  judge.me = me
  judgeMode = true
  clearBoard(); resetPlayersInfo(); unloadJudge()
  setModeUI()
  if (!silent) showOverlay("JUDGE MÓD", "win")
  flushJudgePending()
  return true
}

async function exitJudge() {
  if (judgeHasMatch() && (score1 || score2) && !resultSent) {
    if (!await jConfirm("Rozehraný zápas se neuloží. Přepnout do casual?", "PŘEPNOUT")) return
  }
  unloadJudge()
  judgeMode = false
  clearBoard(); resetPlayersInfo()
  setModeUI()
  showOverlay("CASUAL MÓD", "win")
}

/* ── horní lišta ── */
function renderJudgeBar() {
  if (!judgeMode) return
  const tag = document.getElementById("judgeTag"), info = document.getElementById("judgeInfo"), btn = document.getElementById("judgeMatchBtn")
  tag.textContent = "◂ BBXU"
  tag.title = "Zpět do BBXU" + (judge.me?.nick ? " · judge " + judge.me.nick : "")
  const m = judge.match
  if (m) {
    const lw = judge.leftSlot === 1 ? m.p1_wins : m.p2_wins, rw = judge.leftSlot === 1 ? m.p2_wins : m.p1_wins
    const label = m.stage === "swiss" ? `Swiss · kolo ${m.round}` : m.stage === "gf" ? "Grand finále" : m.stage === "wb" ? `Winners · kolo ${m.round}` : `Losers · kolo ${m.round}`
    info.textContent = [m.tournament_name, label, m.arena ? `aréna ${m.arena}` : "",
      m.best_of > 1 ? `BO${m.best_of} · hra ${lw + rw + 1} · ${lw}:${rw}` : ""].filter(Boolean).join(" · ")
    info.title = info.textContent
    btn.textContent = "ZRUŠIT"; btn.onclick = cancelMatch
  } else {
    info.textContent = judge.sides[1] || judge.sides[2] ? "Naskenuj druhého hráče" : "Naskenuj QR obou hráčů"
    btn.textContent = "VYBRAT ZÁPAS"; btn.onclick = () => openManualMatch()
  }
}

/* ── hráči a jejich beyblady ── */
function cycleUsed(side) {
  const start = judge.battles.length - (judge.battles.length % 3)
  return judge.battles.slice(start).map(b => b.beys[side]).filter(Boolean)
}
function renderJudgePlayers() {
  if (!judgeMode) return
  for (const side of [1, 2]) {
    const p = judge.sides[side]
    const el = document.getElementById(side === 1 ? "player1Info" : "player2Info")
    const scan = document.getElementById(side === 1 ? "scanBtn1" : "scanBtn2")
    if (!p) { el.replaceChildren(); el.className = "playerInfo"; scan.classList.remove("hidden"); continue }
    scan.classList.add("hidden")
    el.className = "playerInfo " + (side === 1 ? "leftAlign" : "rightAlign")
    el.replaceChildren()
    const used = cycleUsed(side)
    const last = judge.battles.length ? judge.battles[judge.battles.length - 1].beys[side] : null
    const nick = document.createElement("div"); nick.className = "nick"; nick.textContent = p.nick; el.appendChild(nick)
    p.beys.filter(Boolean).forEach(b => {
      const d = document.createElement("div")
      d.className = "bey" + (used.includes(b) ? " used" : "") + (b === last ? " last" : "")
      d.textContent = b
      el.appendChild(d)
    })
  }
}

/* ── QR sken ── */
async function judgeScan(side, text) {
  const m = /^BBXU1\|([0-9a-f-]{36})\|([0-9a-f-]{36})$/i.exec(String(text).trim())
  if (!m) return jAlert("Tohle není QR kód z BBXU. Hráč ho najde v BBXU u svého turnaje (Moje vstupenka).")
  const other = judge.sides[side === 1 ? 2 : 1]
  if (other && other.tournament_id !== m[1]) return jAlert("Hráči nejsou ve stejném turnaji! Zkontroluj, že oba ukazují QR ze správného turnaje.")
  let info
  try { info = await rpc("judge_lookup_qr", { p_token: m[2] }) }
  catch (e) { return jAlert(isNetErr(e) ? "Bez připojení nejde QR ověřit. Zkus to znovu, až bude signál." : esc(e.message)) }
  if (other && other.reg === info.reg) return jAlert("Tohle je stejný hráč jako na druhé straně.")
  judge.sides[side] = { ...info, beys: info.beys || [] }
  renderJudgePlayers(); renderJudgeBar()
  if (judge.sides[1] && judge.sides[2]) {
    try {
      const match = await rpc("judge_find_match", { p_reg_a: judge.sides[1].reg, p_reg_b: judge.sides[2].reg })
      loadMatch(match, judge.sides[1].reg)
    } catch (e) {
      jAlert(esc(e.message))
    }
  }
}

function loadMatch(m, leftReg) {
  clearBoard()
  judge.match = m
  judge.leftSlot = m.p1.reg === leftReg ? 1 : 2
  const L = judge.leftSlot === 1 ? m.p1 : m.p2, R = judge.leftSlot === 1 ? m.p2 : m.p1
  judge.sides = { 1: { ...L, tournament_id: m.tournament_id }, 2: { ...R, tournament_id: m.tournament_id } }
  player1Name = L.nick; player2Name = R.nick
  winScore = m.win_score || 7
  document.getElementById("settingsWinVal").textContent = winScore
  judge.startedAt = new Date().toISOString()
  setModeUI(); renderJudgePlayers()
  rpc("start_match", { p_match: m.id }).catch(() => {})
  lastTournamentId = m.tournament_id
  updateSendResultButton()
  showOverlay(`${L.nick} VS ${R.nick}`, "win")
}

function unloadJudge() {
  judge.match = null
  judge.sides = { 1: null, 2: null }
  judge.battles = []
  player1Name = ""; player2Name = ""
  document.body.classList.remove("has-match")
  resetPlayersInfo()
  if (judgeMode) { setModeUI(); renderJudgePlayers() }
}

async function cancelMatch() {
  if ((score1 || score2) && !resultSent && !await jConfirm("Zrušit rozehraný zápas? Body se neuloží.", "ZRUŠIT")) return
  clearBoard(); unloadJudge()
}

/* ── prohození stran před začátkem hry ── */
function swapSides() {
  if (!canSwap()) return
  judge.leftSlot = 3 - judge.leftSlot
  ;[judge.sides[1], judge.sides[2]] = [judge.sides[2], judge.sides[1]]
  ;[player1Name, player2Name] = [player2Name, player1Name]
  if (vibrateEnabled) navigator.vibrate?.(30)
  renderJudgePlayers(); renderJudgeBar()
  showOverlay(`${player1Name} ⇄ ${player2Name}`, "win")
}

/* ── zpět do turnaje v BBXU ── */
async function goBBXU() {
  if (!judgeMode && (score1 || score2) && !await jConfirm("Rozehrané skóre se ztratí. Odejít do BBXU?", "ODEJÍT")) return
  backToBBXU()
}
let lastTournamentId = new URLSearchParams(location.search).get("t")
async function backToBBXU() {
  if (judgeHasMatch() && (score1 || score2) && !resultSent && !await jConfirm("Rozehraný zápas se neuloží. Odejít do BBXU?", "ODEJÍT")) return
  const t = judge.match?.tournament_id || lastTournamentId
  location.href = BBXU_URL + (t ? `#/t/${t}/judge` : "#/")
}

/* ── po dohraném zápase: další na stejné aréně ── */
async function afterMatchNext(next) {
  let queue = []
  try { queue = await rpc("judge_arena_queue", { p_tournament: next.tournament_id, p_arena: next.arena }) } catch (e) {}
  const m = queue[0]
  if (!m) {
    jShow(`<h3>ARÉNA ${next.arena}</h3><p>Teď tu nic dalšího nečeká. Další kolo se objeví, až ho organizátor vylosuje.</p>
      <div class="jRow"><button class="qr-btn cancel" onclick="backToBBXU()">◂ BBXU</button>
      <button class="qr-btn confirm" onclick="jHide()">OK</button></div>`)
    return
  }
  jShow(`<h3>DALŠÍ NA ARÉNĚ ${next.arena}</h3>
    <p><b style="color:var(--cyan)">${esc(m.p1.nick)}</b> vs <b style="color:var(--red)">${esc(m.p2.nick)}</b></p>
    <div class="jRow"><button class="qr-btn cancel" onclick="backToBBXU()">◂ BBXU</button>
    <button class="qr-btn confirm" id="jNext">NAČÍST ZÁPAS</button></div>`)
  document.getElementById("jNext").onclick = () => { jHide(); loadMatch(m, m.p1.reg) }
}

/* ── ruční výběr zápasu (bez QR) ── */
async function openManualMatch(pre = {}) {
  if (!judgeMode) return
  jShow(`<h3>VYBRAT ZÁPAS</h3><p>Načítám turnaje…</p>`)
  try {
    const { data: { session } } = await sb.auth.getSession()
    const [{ data: ts, error: e1 }, { data: claims }] = await Promise.all([
      sb.from("tournaments").select("id,name,arena_count,status").in("status", ["swiss", "topcut"]).order("started_at", { ascending: false }),
      sb.from("arena_judges").select("tournament_id,arena").eq("judge_id", session.user.id),
    ])
    if (e1) throw e1
    if (!ts.length) return jAlert("Teď neběží žádný turnaj.")
    let tId = pre.tournament_id || claims?.[0]?.tournament_id || ts[0].id
    if (!ts.some(t => t.id === tId)) tId = ts[0].id
    let arena = pre.arena || claims?.find(c => c.tournament_id === tId)?.arena || 1
    let queue = [], sel = 0

    const draw = () => {
      const t = ts.find(x => x.id === tId)
      jShow(`<h3>VYBRAT ZÁPAS</h3>
        <select id="mT">${ts.map(x => `<option value="${x.id}" ${x.id === tId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
        <select id="mA">${Array.from({ length: t.arena_count }, (_, i) => i + 1).map(a => `<option value="${a}" ${a === arena ? "selected" : ""}>Aréna ${a}</option>`).join("")}</select>
        <div id="mQ">${queue.length ? queue.map((m, i) => `
          <div class="jMatch ${i === sel ? "sel" : ""}" data-i="${i}">
            <span class="n1">${esc(m.p1.nick)}</span> vs <span class="n2">${esc(m.p2.nick)}</span>
            <div class="meta">${m.stage === "swiss" ? "Swiss · kolo " + m.round : esc(m.key)}${m.best_of > 1 ? ` · BO${m.best_of} (${m.p1_wins}:${m.p2_wins})` : ""}${m.status === "live" ? " · hraje se" : i === 0 ? " · na řadě" : ""}</div>
          </div>`).join("") : `<p>Na téhle aréně teď nic nečeká.</p>`}</div>
        <div class="jRow"><button class="qr-btn cancel" onclick="jHide()">ZAVŘÍT</button>
          <button class="qr-btn confirm" id="mOk" ${queue.length ? "" : "disabled"}>POTVRDIT ZÁPAS</button></div>`)
      document.getElementById("mT").onchange = (e) => { tId = e.target.value; arena = claims?.find(c => c.tournament_id === tId)?.arena || 1; loadQ() }
      document.getElementById("mA").onchange = (e) => { arena = Number(e.target.value); loadQ() }
      document.querySelectorAll(".jMatch").forEach(el => el.onclick = () => { sel = Number(el.dataset.i); draw() })
      const ok = document.getElementById("mOk")
      if (ok) ok.onclick = () => { const m = queue[sel]; jHide(); loadMatch(m, m.p1.reg) }
    }
    const loadQ = async () => {
      try { queue = await rpc("judge_arena_queue", { p_tournament: tId, p_arena: arena }); sel = 0 } catch (e) { queue = []; jAlert(esc(e.message)); return }
      draw()
    }
    await loadQ()
  } catch (e) {
    jAlert(isNetErr(e) ? "Bez připojení nejde seznam zápasů načíst." : esc(e.message))
  }
}

/* ── bod → výběr beyů ── */
let pick = null
function scoreFromDrag(side, pts) {
  if (!judgeMode) return addScore(side, pts)
  if (!judge.match) return showOverlay("NEJDŘÍV NAČTI ZÁPAS", "xtreme")
  if (matchOver) return
  openPicker(side, pts)
}

function openPicker(side, pts) {
  if (!judgeHasMatch() || (matchOver && side !== 0)) return
  pick = { side, pts, beys: { 1: null, 2: null } }
  for (const s of [1, 2]) {
    const avail = judge.sides[s].beys.filter(b => b && !cycleUsed(s).includes(b))
    if (avail.length === 1) pick.beys[s] = avail[0]     // poslední bey v kole se doplní sám
  }
  if (pick.beys[1] && pick.beys[2]) return commitPick()
  drawPicker()
  document.getElementById("pickOverlay").classList.remove("hidden")
}

function drawPicker() {
  const { side, pts } = pick
  const scorerDone = side === 0 || pick.beys[side]
  const title = side === 0 ? "REMÍZA – KTERÉ BEYE HRÁLY?"
    : !scorerDone ? `KDO SKÓROVAL? <span class="pts">+${pts}${pts === 3 ? " XTREME" : ""}</span>`
    : "KTERÝ BEY PROHRÁL?"
  document.getElementById("pickTitle").innerHTML = title
  for (const s of [1, 2]) {
    const col = document.getElementById(s === 1 ? "pickLeft" : "pickRight")
    const used = cycleUsed(s)
    const turn = side === 0 ? !pick.beys[s] : (s === side ? !pick.beys[s] : scorerDone && !pick.beys[s])
    col.classList.toggle("turn", turn)
    const role = side === 0 ? "" : s === side ? "skóroval" : "prohrál"
    col.innerHTML = `<h4>${esc(judge.sides[s].nick)}</h4><div class="hint">${role}</div>` +
      judge.sides[s].beys.map(b => {
        if (!b) return ""
        const cls = pick.beys[s] === b ? (side === 0 ? "win" : s === side ? "win" : "lose") : ""
        const dis = used.includes(b) || (side !== 0 && s !== side && !scorerDone)
        return `<button class="beyPick ${cls}" data-s="${s}" data-b="${esc(b)}" ${dis ? "disabled" : ""}>${esc(b)}</button>`
      }).join("")
  }
  document.querySelectorAll(".beyPick").forEach(btn => btn.onclick = () => {
    pick.beys[Number(btn.dataset.s)] = btn.dataset.b
    drawPicker()
    if (pick.beys[1] && pick.beys[2]) setTimeout(commitPick, 260)
  })
}

function commitPick() {
  if (!pick) return
  const { side, pts, beys } = pick
  pick = null
  document.getElementById("pickOverlay").classList.add("hidden")
  const battle = { slot: side, pts, beys: { 1: beys[1], 2: beys[2] } }
  if (side === 0) {
    judge.battles.push(battle)
    history.push({ p: 0, pts: 0, battle: true })
    const q = [["REMÍZA", "win"]]
    if (judge.battles.length % 3 === 0) { q.push(["OTOČ ARÉNU", "rotate"]); if (vibrateEnabled) navigator.vibrate?.([120, 80, 120]) }
    showOverlaySequence(q)
    updateSendResultButton()
  } else {
    addScore(side, pts, battle)
  }
  renderJudgePlayers()
}
function closePicker() { pick = null; document.getElementById("pickOverlay").classList.add("hidden") }

/* ── odeslání výsledku ── */
function canSwap() { return judgeHasMatch() && !score1 && !score2 && !judge.battles.length && !resultSent }
function updateSendResultButton() {
  document.body.classList.toggle("can-swap", canSwap())
  const btn = document.getElementById("sendResultBtn")
  const canSend = judgeHasMatch() && (score1 >= winScore || score2 >= winScore) && !resultSent
  btn.style.display = canSend ? "block" : "none"
  btn.disabled = !canSend
  if (canSend) btn.innerText = "✓ ODESLAT VÝSLEDEK"
}

function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || [] } catch (e) { return [] } }
function savePending(list) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)) } catch (e) {} }

async function sendResult() {
  const m = judge.match
  if (!m) return
  const btn = document.getElementById("sendResultBtn")
  btn.disabled = true; btn.innerText = "⟳ ODESÍLÁM…"
  const p1Left = judge.leftSlot === 1
  const payload = {
    p_match: m.id,
    p_p1_score: p1Left ? score1 : score2,
    p_p2_score: p1Left ? score2 : score1,
    p_points: judge.battles.map(b => ({
      slot: b.slot === 0 ? 0 : (p1Left ? b.slot : 3 - b.slot),
      pts: b.pts,
      p1_bey: p1Left ? b.beys[1] : b.beys[2],
      p2_bey: p1Left ? b.beys[2] : b.beys[1],
    })),
    p_client_id: crypto.randomUUID(),
    p_started_at: judge.startedAt,
  }
  let res = null, offline = false
  try { res = await rpc("submit_game", payload) }
  catch (e) {
    if (isNetErr(e)) offline = true
    else { btn.disabled = false; btn.innerText = "✓ ODESLAT VÝSLEDEK"; return jAlert("Výsledek nešel uložit: " + esc(e.message)) }
  }
  if (offline) {
    savePending([...loadPending(), { ...payload, label: `${player1Name} ${score1}:${score2} ${player2Name}` }])
    // stav BO dopočítáme lokálně
    const w1 = payload.p_p1_score > payload.p_p2_score
    res = { p1_wins: m.p1_wins + (w1 ? 1 : 0), p2_wins: m.p2_wins + (w1 ? 0 : 1) }
    res.match_done = Math.max(res.p1_wins, res.p2_wins) >= Math.floor(m.best_of / 2) + 1
  }
  resultSent = true
  updateSendResultButton()
  m.p1_wins = res.p1_wins; m.p2_wins = res.p2_wins

  if (res.match_done) {
    showOverlaySequence([[offline ? "BEZ SÍTĚ – ODEŠLE SE POZDĚJI" : "ZÁPAS ULOŽEN ✓", offline ? "xtreme" : "win"]])
    const next = { tournament_id: m.tournament_id, arena: m.arena }
    setTimeout(() => { clearBoard(); unloadJudge(); if (!offline) afterMatchNext(next) }, 1600)
  } else {
    const lw = judge.leftSlot === 1 ? m.p1_wins : m.p2_wins, rw = judge.leftSlot === 1 ? m.p2_wins : m.p1_wins
    showOverlaySequence([[offline ? "BEZ SÍTĚ – ODEŠLE SE POZDĚJI" : `HRA ULOŽENA · ${lw}:${rw}`, offline ? "xtreme" : "win"], ["DALŠÍ HRA", "win"]])
    setTimeout(() => { clearBoard(); judge.startedAt = new Date().toISOString(); renderJudgePlayers(); renderJudgeBar() }, 1400)
  }
}

let flushing = false
async function flushJudgePending() {
  if (flushing || !sb || !navigator.onLine) return
  let list = loadPending()
  if (!list.length) return
  flushing = true
  let sent = 0
  while (list.length) {
    const { label, ...payload } = list[0]
    try { await rpc("submit_game", payload); sent++ }
    catch (e) {
      if (isNetErr(e)) break
      jAlert(`Uložený výsledek <b>${esc(label)}</b> server odmítl: ${esc(e.message)}`)   // např. organizátor zadal ručně
    }
    list.shift(); savePending(list)
  }
  flushing = false
  if (sent && !list.length) showOverlay("ULOŽENÉ VÝSLEDKY ODESLÁNY ✓", "win")
}
window.addEventListener("online", flushJudgePending)

/* ── otevření z BBXU: bbxst.html?match=<id> ── */
;(async function openFromLink() {
  const id = new URLSearchParams(location.search).get("match")
  if (!id) return
  window.history.replaceState(null, "", location.pathname + (lastTournamentId ? `?t=${lastTournamentId}` : ""))
  if (!(await enterJudge(true))) return
  try {
    const m = await rpc("judge_get_match", { p_match: id })
    lastTournamentId = m.tournament_id
    if (m.status === "done") return afterMatchNext({ tournament_id: m.tournament_id, arena: m.arena })
    loadMatch(m, m.p1.reg)
  } catch (e) { jAlert(esc(e.message)) }
})()

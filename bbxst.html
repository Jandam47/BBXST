<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyblade X – Score Tracker</title>

<link rel="manifest" href="bbxst.webmanifest?v=2">
<script>addEventListener('beforeinstallprompt', function (e) { window.__bip = e; dispatchEvent(new Event('bbx:installable')) })</script>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="vendor/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>

<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-user-select: none;
  user-select: none;
}

:root {
  --cyan:  #00ffff;
  --red:   #ff2244;
  --green: #00ff9d;
  --gold:  #ffd700;
  --bg:    #020609;
  --dim:   #2a4a58;
}

body {
  background: var(--bg);
  color: white;
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.bg-energy {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 120% 80% at 0% 50%, rgba(0,255,255,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 120% 80% at 100% 50%, rgba(255,34,68,0.07) 0%, transparent 55%);
  animation: breathe 8s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 1; }
}

/* ===== WEAPON WHEEL ===== */
/* Backdrop dismiss layer */
.wheelBackdrop {
  position: fixed;
  inset: 0;
  z-index: 49;
  display: none;
}
.wheelBackdrop.open { display: block; }

/* The SVG quarter-wheel anchored to bottom-right corner */
.wheelSvg {
  position: fixed;
  right: 0; bottom: 0;
  width: 280px; height: 280px;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.7);
  transform-origin: bottom right;
  transition: opacity .22s ease, transform .22s ease;
}
.wheelSvg.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.wheelSector {
  cursor: pointer;
}
.wheelSector .wFill {
  transition: opacity .15s;
  opacity: 0.82;
}
.wheelSector:active .wFill { opacity: 1; }

.wheelLabel {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  fill: rgba(0,255,255,0.9);
  pointer-events: none;
  text-anchor: middle;
}
.wIcon {
  font-size: 16px;
}
.wText {
  font-size: 7px;
  letter-spacing: 1.5px;
  fill: rgba(200,240,255,0.75);
}

/* ===== MENU TOGGLE ===== */
.menuToggle {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 56px; height: 56px;
  border-radius: 14px;
  background: #0a1520;
  color: var(--cyan);
  font-size: 22px;
  border: 1px solid #0e2a3a;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 60;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow .2s, transform .2s;
}

.menuToggle:hover { box-shadow: 0 0 28px rgba(0,255,255,0.35); }
.menuToggle.open  { transform: rotate(45deg); box-shadow: 0 0 28px rgba(0,255,255,0.5); }

/* ===== PLAYER SIDES ===== */
.player {
  flex: 1;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  transition: box-shadow .2s;
  z-index: 1;
}

.left {
  background: linear-gradient(135deg, #060f1a 0%, #020609 100%);
  border-right: 1px solid #0e2a3a;
}

.right {
  background: linear-gradient(225deg, #1a0608 0%, #020609 100%);
}

.left.active  { box-shadow: inset 0 0 100px rgba(0,255,255,0.2); }
.right.active { box-shadow: inset 0 0 100px rgba(255,34,68,0.2); }

/* ===== SCORE NUMBER ===== */
.score {
  font-family: 'Orbitron', monospace;
  font-size: clamp(100px, 18vw, 160px);
  font-weight: 900;
  cursor: pointer;
  letter-spacing: -4px;
  line-height: 1;
  transition: transform .1s;
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
}

.left  .score { color: var(--cyan); text-shadow: 0 0 40px rgba(0,255,255,0.5); left: 25%; transform: translateY(-50%) translateX(-50%); }
.right .score { color: var(--red);  text-shadow: 0 0 40px rgba(255,34,68,0.5); right: 25%; transform: translateY(-50%) translateX(50%); }

.score:active { transform: translateY(-50%) translateX(-50%) scale(0.93); }
.right .score:active { transform: translateY(-50%) translateX(50%) scale(0.93); }

/* ===== PLAYER INFO (po QR scan) ===== */
.playerInfo {
  position: absolute;
  top: 16px;
  font-size: 16px;
  font-weight: 600;
  max-width: 42%;
  line-height: 1.3;
  z-index: 5;
}

.playerInfo .nick {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 2px;
}

.playerInfo.leftAlign  { left: 16px;  text-align: left; }
.playerInfo.rightAlign { right: 16px; text-align: right; }

.left  .playerInfo { color: var(--cyan); }
.right .playerInfo { color: var(--red); }

.playerInfo .bey {
  font-size: 12px;
  opacity: 0.6;
  letter-spacing: 1px;
}

/* ===== CENTER DRAG BUTTONS ===== */
.center {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  gap: 32px;
  z-index: 10;
}

.dragBtn {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 22px 32px;
  border-radius: 16px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
  touch-action: none;
  cursor: grab;
  transition: box-shadow .2s;
  text-align: center;
}

.dragBtn:hover { box-shadow: 0 0 30px rgba(0,255,255,0.25); }
.dragBtn.active {
  box-shadow: 0 0 40px rgba(255,34,68,0.5);
  border-color: var(--red);
  color: white;
}

/* ===== DRAG ARROWS ===== */
.dragWrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arrowGroup {
  position: absolute;
  display: flex;
  pointer-events: none;
  line-height: 1;
}

.leftArrow  { right: calc(100% + 8px); animation: arrowLeft  1.8s ease-in-out infinite; }
.rightArrow { left:  calc(100% + 8px); animation: arrowRight 1.8s ease-in-out infinite; }

.arrowGroup span {
  font-size: 72px;
  font-weight: 900;
}
.leftArrow  span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.leftArrow  span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }
.rightArrow span:first-child { color: var(--cyan); text-shadow: 0 0 16px rgba(0,255,255,0.9); }
.rightArrow span:last-child  { color: var(--red);  text-shadow: 0 0 16px rgba(255,34,68,0.9); margin-left: -20px; }

@keyframes arrowLeft {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(-14px); opacity: 1; }
}

@keyframes arrowRight {
  0%, 100% { transform: translateX(0);     opacity: .5; }
  50%       { transform: translateX(14px);  opacity: 1; }
}

.arrowGroup.hidden { animation: none; opacity: 0; transition: opacity .4s; }

/* ===== RESET BUTTON ===== */
.resetBtn {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #1a0608;
  border: 1px solid rgba(255,34,68,0.3);
  color: var(--red);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  box-shadow: 0 0 18px rgba(255,34,68,0.25);
  touch-action: none;
  cursor: grab;
  z-index: 25;
  transition: box-shadow .2s;
}

.resetBtn .drag-label {
  font-family: 'Orbitron', monospace;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 1.5px;
  opacity: 0.55;
  line-height: 1;
}

.resetBtn .reset-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
}

.screenReset {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 150px rgba(255,34,68,0.4);
  opacity: 0;
  transition: opacity .2s;
  z-index: 40;
}

.screenReset.active { opacity: 1; }

/* ===== WAKE BUTTON ===== */
.wakeBtn {
  position: fixed;
  bottom: 20px; right: 86px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 18px rgba(0,255,255,0.2);
  z-index: 35;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .3s;
}

.wake-progress {
  position: absolute;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  top: 0; left: 0;
  pointer-events: none;
}

.wake-progress circle {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 4;
  stroke-dasharray: 163;
  stroke-dashoffset: 163;
  transition: none;
}

.wakeBtn.cooldown { box-shadow: 0 0 20px rgba(255,34,68,0.4); border-color: rgba(255,34,68,0.3); }
.wakeBtn.active-wake { box-shadow: 0 0 24px rgba(0,255,255,0.4); }

/* ===== BEYBLADE SPINNER ===== */
.beyblade-icon {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  opacity: 0.75;
  transition: opacity .3s;
}

.beyblade-svg {
  width: 30px;
  height: 30px;
  filter: drop-shadow(0 0 3px rgba(0,255,255,0.4));
}

.wakeBtn.active-wake .beyblade-icon {
  opacity: 1;
  color: var(--cyan);
}

.wakeBtn.cooldown .beyblade-icon {
  color: var(--red);
  filter: drop-shadow(0 0 6px rgba(255,34,68,0.6));
}

/* ===== QR SCAN BUTTON ===== */
.scanBtn {
  position: absolute;
  top: 16px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 16px rgba(0,255,255,0.15);
  z-index: 15;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.6);
  transition: opacity .3s, transform .3s, box-shadow .2s;
}

.scanBtn:hover { box-shadow: 0 0 26px rgba(0,255,255,0.3); }
.scanBtn.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.scanBtn.hidden  { opacity: 0; pointer-events: none; transform: scale(0.6); }

#left  .scanBtn { left: 50%; transform-origin: center; }
#right .scanBtn { right: 50%; }

/* ===== QR OVERLAY ===== */
.qrOverlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,9,0.97);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 200;
  backdrop-filter: blur(10px);
}

.qrOverlay.hidden { display: none; }

#qrReader { width: 300px; border-radius: 12px; overflow: hidden; }

.qrResult {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--cyan);
  text-align: center;
  max-width: 300px;
  word-break: break-all;
  min-height: 40px;
  padding: 10px;
  background: #0a1520;
  border: 1px solid #0e2a3a;
  border-radius: 8px;
  width: 300px;
}

.qr-source-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.qr-tab {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(0,255,255,0.2);
  background: #0a1520;
  color: rgba(0,255,255,0.4);
  cursor: pointer;
  transition: all .2s;
}

.qr-tab.active {
  color: var(--cyan);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  box-shadow: 0 0 14px rgba(0,255,255,0.2);
}

.gallery-pick {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 10px;
  border: 1px solid rgba(0,255,255,0.25);
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  cursor: pointer;
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
  transition: all .2s;
}

.gallery-pick:hover { box-shadow: 0 0 24px rgba(0,255,255,0.3); }
.gallery-pick.hidden { display: none; }

.qr-label {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--cyan);
  margin-bottom: 8px;
}

.qr-actions {
  display: flex;
  gap: 12px;
}

.qr-btn {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: all .2s;
}

.qr-btn.confirm {
  background: linear-gradient(135deg, #001a3a, #002a5a);
  color: var(--cyan);
  border: 1px solid rgba(0,255,255,0.2);
  box-shadow: 0 0 14px rgba(0,255,255,0.15);
}

.qr-btn.cancel {
  background: #0a1520;
  color: var(--red);
  border: 1px solid rgba(255,34,68,0.2);
}

.qr-btn.cancel:hover { box-shadow: 0 0 14px rgba(255,34,68,0.2); }

/* ===== WIN OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(2,6,9,0.88);
  opacity: 0;
  transition: opacity .3s;
  z-index: 100;
  pointer-events: none;
}

.overlay.show { opacity: 1; }

.overlay-text {
  font-family: 'Orbitron', monospace;
  font-size: clamp(40px, 8vw, 72px);
  font-weight: 900;
  letter-spacing: 4px;
  text-align: center;
}

.win   .overlay-text { color: var(--green); text-shadow: 0 0 60px var(--green); }
.xtreme .overlay-text { color: var(--red);  text-shadow: 0 0 60px var(--red); }

/* ===== SEND RESULT BUTTON ===== */
.sendResultBtn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 14px 28px;
  border-radius: 12px;
  background: linear-gradient(135deg, #001a0a, #002a12);
  color: var(--green);
  border: 1px solid rgba(0,255,157,0.25);
  box-shadow: 0 0 24px rgba(0,255,157,0.2);
  display: none;
  z-index: 50;
  cursor: pointer;
  transition: box-shadow .2s;
  white-space: nowrap;
}

.sendResultBtn:hover { box-shadow: 0 0 36px rgba(0,255,157,0.35); }
.sendResultBtn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ═════════════ JUDGE MÓD ═════════════ */
/* tahací přepínač casual/judge – nad resetem */
.modeBtn {
  position: fixed; left: 20px; bottom: 96px;
  width: 64px; height: 64px; border-radius: 50%;
  background: #0a1520; border: 1px solid rgba(0,255,255,0.3); color: var(--cyan);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  box-shadow: 0 0 18px rgba(0,255,255,0.2); touch-action: none; cursor: grab; z-index: 25; transition: box-shadow .2s, border-color .2s, color .2s;
}
.modeBtn .drag-label { font-family: 'Orbitron', monospace; font-size: 7px; font-weight: 700; letter-spacing: 1.5px; opacity: .55; line-height: 1; }
.modeBtn .mode-label { font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; line-height: 1; }
body.judge .modeBtn { color: var(--gold); border-color: rgba(255,215,0,0.45); box-shadow: 0 0 22px rgba(255,215,0,0.3); background: #1a1500; }
.screenMode { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 150px rgba(255,215,0,0.35); opacity: 0; transition: opacity .2s; z-index: 40; }
.screenMode.active { opacity: 1; }

/* lišta judge – dole mezi rohovými tlačítky, mimo tahací tlačítka */
.judgeBar {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: none; flex-direction: row; align-items: center; gap: 8px; z-index: 30;
  max-width: calc(100vw - 320px); min-width: 0;
}
@media (max-width: 700px) { .judgeBar { max-width: calc(100vw - 180px); flex-wrap: wrap; justify-content: center; } }
body.judge .judgeBar { display: flex; }
.judgeTag { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; color: var(--gold);
  padding: 4px 10px; border: 1px solid rgba(255,215,0,0.35); border-radius: 20px; background: rgba(26,21,0,0.85); white-space: nowrap; }
.judgeInfo { font-size: 14px; font-weight: 600; color: rgba(200,240,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.judgeBtn { flex: none; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 1.5px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  background: #0a1520; color: var(--cyan); border: 1px solid rgba(0,255,255,0.25); box-shadow: 0 0 12px rgba(0,255,255,0.12); }
.judgeBtn.gold { color: var(--gold); border-color: rgba(255,215,0,0.4); }

/* beyblady hráče v judge módu */
.playerInfo .bey.used { opacity: .25; text-decoration: line-through; }
.playerInfo .bey.last { opacity: 1; color: white; }

/* remíza – jen s načteným zápasem */
.judgeBar .drawBtn { display: none; }
body.judge.has-match .judgeBar .drawBtn { display: block; }

/* výběr beyů po bodu */
/* ═════════════ TRAINING MÓD (komunitní trénink) ═════════════ */
.trainBtn { bottom: 172px; display: none; }
body.has-training .trainBtn { display: flex; }
body.judge .trainBtn { display: none; }
body.training .modeBtn:not(.trainBtn) { display: none; }
body.training .trainBtn { color: var(--green); border-color: rgba(0,255,157,0.45); box-shadow: 0 0 22px rgba(0,255,157,0.3); background: #00160e; }
.screenMode.train { box-shadow: inset 0 0 150px rgba(0,255,157,0.35); }
.judgeBar.trainBar { display: none; }
body.training .judgeBar.trainBar { display: flex; }
body.judge .judgeBar.trainBar { display: none; }
.trainBar .judgeTag { color: var(--green); border-color: rgba(0,255,157,0.35); background: rgba(0,22,14,0.85); }
body.training .trainBar .drawBtn { display: none; }
body.training.has-tmatch .trainBar .drawBtn { display: block; }
.trOverlay { position: fixed; inset: 0; z-index: 205; background: rgba(2,6,9,0.95); backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; padding: 14px; overflow: auto; }
.trOverlay > :first-child { margin-top: auto; } .trOverlay > :last-child { margin-bottom: auto; }
.trOverlay.hidden { display: none; }
.trTitle { font-family: 'Orbitron', monospace; font-size: clamp(13px, 2.2vw, 18px); letter-spacing: 3px; color: var(--green); text-align: center; }
.trSub { font-size: 14px; color: rgba(200,240,255,0.6); text-align: center; }
/* kolečko hráčů */
.trRing { position: relative; width: min(78vh, 92vw, 520px); aspect-ratio: 1; flex: none; }
.trRing::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1px dashed rgba(0,255,157,0.25); }
.trCenter { position: absolute; inset: 32%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; border: 1px solid rgba(0,255,157,0.35); box-shadow: 0 0 30px rgba(0,255,157,0.15) inset; padding: 6px; }
.trCenter b { font-family: 'Orbitron', monospace; font-size: clamp(10px, 1.8vw, 14px); letter-spacing: 2px; color: var(--green); }
.trCenter small { font-size: 12px; color: rgba(200,240,255,0.55); margin-top: 4px; }
.trP { position: absolute; transform: translate(-50%, -50%); min-width: 92px; max-width: 34%; padding: 10px 12px; border-radius: 14px; cursor: pointer;
  font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(15px, 2.2vw, 19px); color: white; background: #0a1520;
  border: 1px solid #1a3a4a; box-shadow: 0 0 16px rgba(0,255,255,0.12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>

/* ── STATE ── */
let score1 = 0, score2 = 0, winScore = 7
let history = []
let firstScoreUsed = false
let player1Name = "", player2Name = ""
let resultSent = false
let isLandscape = screen.orientation
  ? screen.orientation.type.startsWith("landscape")
  : window.innerWidth > window.innerHeight
let wakeActive = false
let cooldownTime = 30
let cooldownTimeout = null
let holdTimer = null

/* ── ELEMENTS ── */
const s1          = document.getElementById("score1")
const s2          = document.getElementById("score2")
const left        = document.getElementById("left")
const right       = document.getElementById("right")
const resetScreen = document.getElementById("screenReset")
const overlay     = document.getElementById("overlay")
const overlayText = document.getElementById("overlayText")
const wakeBtn     = document.getElementById("wakeBtn")
const circle      = wakeBtn.querySelector(".wake-progress circle")
const resetBtn    = document.getElementById("resetBtn")

/* ══════════════════════════════════════════════
   SCORE
══════════════════════════════════════════════ */
let matchOver = false

function updateMatchState() {
  matchOver = score1 >= winScore || score2 >= winScore
}

function addScore(p, pts, battle) {
  // Po skončení zápasu už nejde přidávat, jen ubírat / revert
  if (matchOver && pts > 0) return

  if (!firstScoreUsed) {
    firstScoreUsed = true
    document.querySelectorAll(".arrowGroup").forEach(a => a.classList.add("hidden"))
  }

  let actual = pts
  if (p === 1) { const prev = score1; score1 = Math.max(0, Math.min(score1 + pts, winScore)); actual = score1 - prev; s1.innerText = score1 }
  if (p === 2) { const prev = score2; score2 = Math.max(0, Math.min(score2 + pts, winScore)); actual = score2 - prev; s2.innerText = score2 }
  if (actual === 0) return
  if (battle) { battle.pts = actual; judge.battles.push(battle) }
  history.push({ p, pts: actual, battle: !!battle })

  updateMatchState()

  if (pts > 0) {
    // Výhru vyhodnocuj jen u hráče, který právě skóroval
    const won = (p === 1 ? score1 : score2) >= winScore
    const name = p === 1 ? player1Name : player2Name
    const winText = name ? name + " WINS" : (p === 1 ? "LEVÝ VÍTĚZ" : "PRAVÝ VÍTĚZ")

    const queue = []
    if (pts === 3) queue.push(["XTREME FINISH", "xtreme"])
    if (won)       queue.push([winText, "win"])
    else if (battle && judge.battles.length % 3 === 0) { queue.push(["OTOČ ARÉNU", "rotate"]); if (vibrateEnabled) navigator.vibrate?.([120, 80, 120]) }
    if (queue.length) showOverlaySequence(queue)

    startCooldown()
  }

  updateSendResultButton()
}

function subtractScore(p) {
  if (judgeHasMatch()) return showOverlay("V JUDGE MÓDU POUŽIJ REVERT", "xtreme")
  if (trainingMode) return showOverlay("V TRÉNINKU POUŽIJ REVERT", "xtreme")
  if (p === 1 && score1 > 0) addScore(1, -1)
  if (p === 2 && score2 > 0) addScore(2, -1)
}

function revert() {
  if (trainingMode) return trUndo()
  const h = history.pop()
  if (!h) return
  if (h.battle) { judge.battles.pop(); renderJudgePlayers() }   // judge: zahoď i zápis souboje (vč. remízy)
  if (h.p === 1) { score1 -= h.pts; s1.innerText = score1 }
  if (h.p === 2) { score2 -= h.pts; s2.innerText = score2 }
  updateMatchState()
  updateSendResultButton()
}

let settingsOpen = false
let vibrateEnabled = true
let winControlsOpen = false

function openSettings() {
  settingsOpen = true
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelMain").style.display = "none"
  document.getElementById("wheelMainHub").style.display = "none"
  document.getElementById("wheelSettings").style.display = ""
  updateSettingsUI()
}

function closeSettings() {
  settingsOpen = false
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
  document.getElementById("wheelSettings").style.display = "none"
  document.getElementById("wheelMain").style.display = ""
  document.getElementById("wheelMainHub").style.display = ""
}

function toggleWinControls(e) {
  e && e.stopPropagation()
  winControlsOpen = !winControlsOpen
  document.getElementById("winControls").style.display = winControlsOpen ? "" : "none"
}

function hideWinControls() {
  winControlsOpen = false
  document.getElementById("winControls").style.display = "none"
}

function updateSettingsUI() {
  document.getElementById("settingsWinVal").textContent = winScore
  const on = vibrateEnabled
  // pill knob pozice pro nové souřadnice (pill x=108, šířka=52)
  document.getElementById("vibrateKnob").setAttribute("cx", on ? "151" : "121")
  document.getElementById("vibrateKnobText").setAttribute("x", on ? "151" : "121")
  document.getElementById("vibrateKnobText").textContent = on ? "ON" : "OFF"
  document.getElementById("vibratePillFill").setAttribute("x", on ? "133" : "109")
  document.getElementById("vibratePillFill").setAttribute("fill", on ? "rgba(0,255,255,0.25)" : "rgba(255,34,68,0.15)")
  document.getElementById("vibrateKnob").setAttribute("fill", on ? "rgba(0,255,255,0.9)" : "rgba(255,34,68,0.8)")
}

function changeWinDelta(delta) {
  if (judgeHasMatch()) return showOverlay("V JUDGE MÓDU URČUJE BODY TURNAJ", "xtreme")
  const next = winScore + delta
  if (next < 1 || next > 99) return
  winScore = next
  document.getElementById("settingsWinVal").textContent = winScore
  updateMatchState()
  updateSendResultButton()
}

function toggleVibrate() {
  vibrateEnabled = !vibrateEnabled
  updateSettingsUI()
}

/* ══════════════════════════════════════════════
   OVERLAY
══════════════════════════════════════════════ */
const OVERLAY_MS = 1400
let overlayTimers = []

// Zobrazí hlášky postupně za sebou; nová sekvence zruší tu předchozí
function showOverlaySequence(items) {
  overlayTimers.forEach(clearTimeout)
  overlayTimers = []
  items.forEach(([text, cls], i) => {
    overlayTimers.push(setTimeout(() => {
      overlayText.innerText = text
      overlay.className = "overlay show " + cls
    }, i * OVERLAY_MS))
  })
  overlayTimers.push(setTimeout(() => overlay.className = "overlay", items.length * OVERLAY_MS))
}

function showOverlay(text, cls) {
  showOverlaySequence([[text, cls]])
}

/* ══════════════════════════════════════════════
   RESET
   – někdo má body  → vynuluje jen skóre (hráči zůstanou)
   – oba mají 0     → odhlásí i naskenované hráče
══════════════════════════════════════════════ */
function resetScore() {
  if (trainingMode) return trReset()
  const clearPlayers = score1 === 0 && score2 === 0

  score1 = score2 = 0
  history = []
  judge.battles = []

document.querySelectorAll(".dragBtn").forEach(b => {
  let sx = 0, dx = 0, dragging = false, hapticFired = false, hapticInterval = null

  b.addEventListener("pointerdown", e => {
    dragging = true
    hapticFired = false
    sx = e.clientX
    b.classList.add("active")
    b.setPointerCapture(e.pointerId)
  })

  b.addEventListener("pointermove", e => {
    if (!dragging) return
    dx = e.clientX - sx
    b.style.transform = `translateX(${dx}px)`
    left.classList.toggle("active",  dx < -80)
    right.classList.toggle("active", dx > 80)

    // Haptic v moment překročení prahu
    if (!hapticFired && (dx < -80 || dx > 80)) {
      hapticFired = true
      if (vibrateEnabled) {
        const pattern = [25,25,50,25,75,25,100,25,75,25,50,25,25]
        const total = pattern.reduce((a,b) => a+b, 0)
        navigator.vibrate?.(pattern)
        hapticInterval = setInterval(() => navigator.vibrate?.(pattern), total + 750)
      }
    }
    // Reset haptic pokud se vrátí zpět pod práh
    if (hapticFired && dx > -80 && dx < 80) {
      hapticFired = false
      clearInterval(hapticInterval)
      navigator.vibrate?.(0)
    }
  })

  function endDrag(commit) {
    if (!dragging) return
    b.style.transform = ""
    b.classList.remove("active")
    left.classList.remove("active")
    right.classList.remove("active")
    clearInterval(hapticInterval)
    hapticInterval = null
    navigator.vibrate?.(0)
    if (commit) {
      if (dx < -80) scoreFromDrag(1, +b.dataset.points)
      if (dx > 80)  scoreFromDrag(2, +b.dataset.points)
    }
    dragging = false; dx = 0
  }

  b.addEventListener("pointerup",     () => endDrag(true))
  // Systém gesto přerušil (notifikace, gesto od kraje…) → nic nezapisovat, zastavit vibrace
  b.addEventListener("pointercancel", () => endDrag(false))
})

/* ── SCREEN WAKE LOCK – displej nezhasne, dokud je WAKE aktivní ── */
let wakeLock = null
async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return
  try {
    wakeLock = await navigator.wakeLock.request("screen")
    wakeLock.addEventListener("release", () => { wakeLock = null })
  } catch (e) { wakeLock = null }
}
// Prohlížeč zámek uvolní při přepnutí aplikace → po návratu ho obnov
document.addEventListener("visibilitychange", () => {
  if (wakeActive && document.visibilityState === "visible") requestWakeLock()
})

function startCooldown() {
  if (!wakeActive) return

  // Boost efekt při restartu cooldownu
  if (cooldownTimeout) {
    clearTimeout(cooldownTimeout)
    beySpeed = BEY_MAX * 1.2   // krátký kick navíc
  }

  cooldownStart = Date.now()

  wakeBtn.classList.add("cooldown")
  circle.style.transition = "none"
  circle.style.strokeDashoffset = "163"

  setTimeout(() => {
    circle.style.transition = `stroke-dashoffset ${cooldownTime}s linear`
    circle.style.strokeDashoffset = "0"
  }, 50)

  cooldownTimeout = setTimeout(() => {
    wakeBtn.classList.remove("cooldown")
    circle.style.transition = "none"
    circle.style.strokeDashoffset = "163"
    cooldownStart = null
    cooldownTimeout = null
  }, cooldownTime * 1000)
}

/* ── BEYBLADE PHYSICS SPINNER ── */
const beybladeEl = wakeBtn.querySelector(".beyblade-svg")
const BEY_MAX    = 13        // °/frame při 100% (≈ 2.2 rot/s @ 60fps)
let beyAngle     = 0
let beySpeed     = 0
let cooldownStart = null

;(function beyFrame() {
  requestAnimationFrame(beyFrame)

  let target = 0
  if (cooldownStart !== null) {
    const elapsed   = (Date.now() - cooldownStart) / 1000
    const fraction  = Math.max(0, 1 - elapsed / cooldownTime)
    target = BEY_MAX * fraction
  }

  // Plynulý přechod k cílové rychlosti
  // – při zpomalování: pomalý ease (fyzika)
  // – při zrychlení (boost): okamžitě přijme vyšší speed
  if (target < beySpeed) {
    beySpeed += (target - beySpeed) * 0.025   // pomalé dojíždění
  } else {
    beySpeed = Math.max(beySpeed, target)      // boost nastoupí hned
  }

  if (beySpeed > 0.05) {
    beyAngle = (beyAngle + beySpeed) % 360
    beybladeEl.style.transform = `rotate(${beyAngle}deg)`
  }
})()

function parseQR(player, text) {
  const nick = text.match(/Nick\s*[:\-]?\s*(.+)/i)
  const b1   = text.match(/Beyblade 1\s*[:\-]?\s*(.+)/i)
  const b2   = text.match(/Beyblade 2\s*[:\-]?\s*(.+)/i)
  const b3   = text.match(/Beyblade 3\s*[:\-]?\s*(.+)/i)

  const nickVal = nick ? nick[1].trim() : ""
  if (player === 1) player1Name = nickVal
  if (player === 2) player2Name = nickVal

  const scanBtn = document.getElementById(player === 1 ? "scanBtn1" : "scanBtn2")
  if (scanBtn) scanBtn.classList.add("hidden")

  const infoEl = document.getElementById(player === 1 ? "player1Info" : "player2Info")
  infoEl.className = "playerInfo " + (player === 1 ? "leftAlign" : "rightAlign")

  // Obsah QR se vkládá jako text, ne HTML (ochrana proti podstrčenému kódu)
  infoEl.replaceChildren()
  const addLine = (cls, txt) => {
    const div = document.createElement("div")
    div.className = cls
    div.textContent = txt
    infoEl.appendChild(div)
  }
  if (nickVal) addLine("nick", nickVal)
  ;[b1, b2, b3].forEach(b => { if (b) addLine("bey", b[1].trim()) })

  updateSendResultButton()
}

/* ══════════════════════════════════════════════
   JUDGE MÓD – napojení na BBXU (Supabase)
   casual (výchozí) = obyčejné počítadlo bez odesílání
   judge            = QR / ruční výběr zápasu, zápis beyů, odeslání výsledku
══════════════════════════════════════════════ */
const CFG = window.BBX_CONFIG || {}
const BBXU_URL = "./index.html"
const SB_OK = !!(window.supabase && CFG.supabaseUrl && !CFG.supabaseUrl.includes("SEM-VLOZ"))
const sb = SB_OK ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } }) : null
const JUDGE_ROLES = ["judge", "organizer", "admin", "superadmin"]
const ME_KEY = "bbxst_judge_me"
const PENDING_KEY = "bbxst_judge_pending"
const LIVE_KEY = "bbxst_judge_live"         // rozehraná hra – pro obnovení po zavření BBXST
const OPENED_WITH_MATCH = new URLSearchParams(location.search).has("match")

let judgeMode = false
const judge = {
  me: null,
  sides: { 1: null, 2: null },   // strana stolu → { reg, nick, beys[], tournament_id, tournament_name }
  match: null,                     // zápas z BBXU
  leftSlot: 1,                     // levá strana = p1 (1) nebo p2 (2) v databázi
  battles: [],                     // { slot: 0|1|2 (strana stolu), pts, beys: {1: …, 2: …} }
  startedAt: null,
}
const judgeHasMatch = () => judgeMode && !!judge.match
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const isNetErr = (e) => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message || String(e))

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args)
  if (error) throw error
  return data
}

/* ── dialogy ── */
/* ── uložený stav rozehrané hry (lokálně + na serveru v matches.live_state) ── */
const gameNo = (m) => (m?.p1_wins || 0) + (m?.p2_wins || 0)
function stateNow() {   // orientace podle databáze (p1/p2), ne podle stran stolu
  const p1Left = judge.leftSlot === 1
  return {
    game: gameNo(judge.match), left: judge.leftSlot, started_at: judge.startedAt,
    battles: judge.battles.map(b => ({
      slot: b.slot === 0 ? 0 : (p1Left ? b.slot : 3 - b.slot), pts: b.pts, finish: b.finish || null,
      p1_bey: p1Left ? b.beys[1] : b.beys[2], p2_bey: p1Left ? b.beys[2] : b.beys[1],
    })),
  }
}
function readLocal() { try { return JSON.parse(localStorage.getItem(LIVE_KEY)) } catch (e) { return null } }
function clearLocal() { try { localStorage.removeItem(LIVE_KEY) } catch (e) {} }
function saveLocal() {
  if (!judgeHasMatch() || resultSent) return
  try { localStorage.setItem(LIVE_KEY, JSON.stringify({ match_id: judge.match.id, match: judge.match, ...stateNow() })) } catch (e) {}
}
function applyState(st) {   // judge.leftSlot už musí být nastavený
  const p1Left = judge.leftSlot === 1
  judge.battles = (st.battles || []).map(b => ({
    slot: b.slot === 0 ? 0 : (p1Left ? b.slot : 3 - b.slot), pts: b.pts, finish: b.finish || null,
    beys: { 1: p1Left ? b.p1_bey : b.p2_bey, 2: p1Left ? b.p2_bey : b.p1_bey },
  }))
  history = judge.battles.map(b => ({ p: b.slot, pts: b.slot ? b.pts : 0, battle: true }))
  const sum = (side) => judge.battles.filter(b => b.slot === side).reduce((a, b) => a + b.pts, 0)
  score1 = Math.min(winScore, sum(1)); score2 = Math.min(winScore, sum(2))
  s1.innerText = score1; s2.innerText = score2
  if (judge.battles.length) {
    firstScoreUsed = true
    document.querySelectorAll(".arrowGroup").forEach(a => a.classList.add("hidden"))
  }
  if (st.started_at) judge.startedAt = st.started_at
  updateMatchState()
}

async function enterJudge(silent) {
  if (trainingMode) exitTraining(true)
  if (!sb) { jAlert("Judge mód potřebuje propojení s BBXU – vyplň <b>js/config.js</b>."); return false }
  const { data: { session } } = await sb.auth.getSession()
  if (!session || session.user.is_anonymous) {
    jAlert(`Pro judge mód se přihlas v <a href="${BBXU_URL}#/login">BBXU</a> účtem s funkcí Judge.<br>Na stejném zařízení pak budeš přihlášený i tady.`)
    return false
  }
  let me = null
  try {
    const { data, error } = await sb.from("profiles").select("id, nick, role").eq("id", session.user.id).single()
    if (error) throw error
    me = data
    localStorage.setItem(ME_KEY, JSON.stringify(me))
  } catch (e) {
    // bez sítě vezmi poslední ověřenou roli
    try { me = JSON.parse(localStorage.getItem(ME_KEY)) } catch {}
    if (!me || me.id !== session.user.id) { jAlert("Nepodařilo se ověřit účet: " + esc(e.message || e)); return false }
  }
  if (!JUDGE_ROLES.includes(me.role)) {
    jAlert(`Účet <b>${esc(me.nick)}</b> nemá funkci Judge. Přidělí ti ji admin v BBXU.`)
    return false
  }
  judge.me = me
  judgeMode = true
  clearBoard(); resetPlayersInfo(); unloadJudge()
  setModeUI()
  if (!silent) showOverlay("JUDGE MÓD", "win")
  flushJudgePending()
  return true
}

async function exitJudge() {
  if (judgeHasMatch() && (score1 || score2) && !resultSent) {
    if (!await jConfirm("Přepnout do casual? Rozehraná hra zůstane uložená – dokončíš ji z BBXU (Rozhodovat).", "PŘEPNOUT")) return
  }
  clearLocal()
  unloadJudge()
  judgeMode = false
  clearBoard(); resetPlayersInfo()
  setModeUI()
  showOverlay("CASUAL MÓD", "win")
}

/* ── horní lišta ── */
function renderJudgeBar() {
  if (!judgeMode) return
  const tag = document.getElementById("judgeTag"), info = document.getElementById("judgeInfo"), btn = document.getElementById("judgeMatchBtn")
  const m = judge.match
  tag.textContent = m ? "PASS JUDGE" : "◂ BBXU"
  tag.title = m ? "Předat zápas jinému judge – skóre zůstane uložené" : "Zpět do BBXU" + (judge.me?.nick ? " · judge " + judge.me.nick : "")
  tag.onclick = m ? passJudge : backToBBXU
  if (m) {
    const lw = judge.leftSlot === 1 ? m.p1_wins : m.p2_wins, rw = judge.leftSlot === 1 ? m.p2_wins : m.p1_wins
    const label = m.stage === "swiss" ? `${m.format === "deathmatch" ? "Deathmatch" : "Swiss"} · kolo ${m.round}` : m.stage === "gf" ? (m.top_cut === 2 ? "Finále" : "Grand finále") : m.stage === "wb" ? `Winners · kolo ${m.round}` : `Losers · kolo ${m.round}`
    info.textContent = [m.tournament_name, label, m.arena ? `aréna ${m.arena}` : "",
      m.best_of > 1 ? `BO${m.best_of} · hra ${lw + rw + 1} · ${lw}:${rw}` : ""].filter(Boolean).join(" · ")
    info.title = info.textContent
    btn.textContent = "ZRUŠIT"; btn.onclick = cancelMatch
  } else {
    const one = judge.sides[1] || judge.sides[2]
    info.textContent = one ? (one.opp_nick ? `${one.nick} · ${one.tournament_name} · ${one.match?.arena ? `aréna ${one.match.arena} · ` : ""}naskenuj soupeře ${one.opp_nick}` : "Naskenuj druhého hráče") : "Naskenuj QR obou hráčů"
    btn.textContent = "VYBRAT ZÁPAS"; btn.onclick = () => openManualMatch()
  }
}

/* ── hráči a jejich beyblady ── */
function cycleUsed(side) {
  if (trainingMode) {
    // tournament mode: bey se v sadě neopakuje (sada = tolik soubojů, kolik má hráč beyů)
    if (!tr.match?.settings?.tourney) return []
    if (trCompute().over) return []                  // hra dohraná → další souboj je nová hra, sada od nuly
    const n = (judge.sides[side]?.beys || []).filter(Boolean).length
    if (n < 2) return []
    const start = judge.battles.length - (judge.battles.length % n)
    return judge.battles.slice(start).map(b => b.beys[side]).filter(Boolean)
  }
  const start = judge.battles.length - (judge.battles.length % 3)
  return judge.battles.slice(start).map(b => b.beys[side]).filter(Boolean)
}
function renderJudgePlayers() {
  if (!judgeMode && !trainingMode) return
  for (const side of [1, 2]) {
    const p = judge.sides[side]
    const el = document.getElementById(side === 1 ? "player1Info" : "player2Info")
    const scan = document.getElementById(side === 1 ? "scanBtn1" : "scanBtn2")
    if (!p) { el.replaceChildren(); el.className = "playerInfo"; scan.classList.remove("hidden"); continue }
    scan.classList.add("hidden")
    el.className = "playerInfo " + (side === 1 ? "leftAlign" : "rightAlign")
    el.replaceChildren()
    const used = cycleUsed(side)
    const last = judge.battles.length ? judge.battles[judge.battles.length - 1].beys[side] : null
    const nick = document.createElement("div"); nick.className = "nick"; nick.textContent = p.nick; el.appendChild(nick)
    p.beys.filter(Boolean).forEach(b => {
      const d = document.createElement("div")
      d.className = "bey" + (used.includes(b) ? " used" : "") + (b === last ? " last" : "")
      d.textContent = b
      el.appendChild(d)
    })
  }
}

/* ── QR sken ── jen hráč, který teď v běžícím turnaji hraje; druhý sken musí být jeho soupeř */
async function judgeScan(side, text) {
  const m = /^BBXU1\|([0-9a-f-]{36})\|([0-9a-f-]{36})$/i.exec(String(text).trim())
  if (!m) return jAlert("Tohle není QR kód z BBXU. Hráč ho najde v BBXU u svého turnaje (Moje vstupenka).")
  const other = judge.sides[side === 1 ? 2 : 1]
  if (other && other.tournament_id !== m[1]) return jAlert(`Hráči nejsou ve stejném turnaji! <b>${esc(other.nick)}</b> hraje <b>${esc(other.tournament_name || "jiný turnaj")}</b>.`)
  let info
  try { info = await rpc("judge_scan_qr", { p_token: m[2] }) }
  catch (e) { return jAlert(isNetErr(e) ? "Bez připojení nejde QR ověřit. Zkus to znovu, až bude signál." : esc(e.message)) }
  if (other && other.reg === info.reg) return jAlert("Tohle je stejný hráč jako na druhé straně.")
  // druhý hráč musí být soupeř, kterého prvnímu přidělil turnaj
  if (other && other.opp_reg && other.opp_reg !== info.reg) {
    return jAlert(`Tohle není soupeř! <b>${esc(other.nick)}</b> teď hraje proti <b>${esc(other.opp_nick)}</b>${other.match?.arena ? ` (aréna ${other.match.arena})` : ""}.<br>Naskenoval jsi <b>${esc(info.nick)}</b>.`)
  }
  judge.sides[side] = { ...info, beys: info.beys || [] }
  renderJudgePlayers(); renderJudgeBar()
  if (judge.sides[1] && judge.sides[2]) {
    loadMatch((other?.match) || info.match, judge.sides[1].reg)
  }
}

async function loadMatch(m, leftReg = null) {
  const me = judge.me?.id
  if (m.judge_id && m.judge_id !== me && m.status === "live") {
    const sc = m.live_p1 != null ? ` za stavu <b>${m.live_p1}:${m.live_p2}</b>` : ""
    if (!await jConfirm(`Zápas <b>${esc(m.p1.nick)} vs ${esc(m.p2.nick)}</b> teď řídí <b>${esc(m.judge_nick || "jiný judge")}</b>.<br>
      Převzít ho${sc}? Hra pokračuje tam, kde skončila.`, "PŘEVZÍT")) return
  }
  judge.match = null
  clearBoard()
  // rozehraná hra: novější z místního a serverového stavu
  const g = gameNo(m), local = readLocal()
  let st = m.live_state?.game === g ? m.live_state : null
  const loc = local?.match_id === m.id && local.game === g && (!m.judge_id || m.judge_id === me) ? local : null
  if (loc && (!st || (loc.battles?.length || 0) >= (st.battles?.length || 0))) st = loc
  if (!st?.battles?.length) st = null

  judge.match = m
  judge.leftSlot = leftReg ? (m.p1.reg === leftReg ? 1 : 2) : (st?.left === 2 ? 2 : 1)
  const L = judge.leftSlot === 1 ? m.p1 : m.p2, R = judge.leftSlot === 1 ? m.p2 : m.p1
  judge.sides = { 1: { ...L, tournament_id: m.tournament_id }, 2: { ...R, tournament_id: m.tournament_id } }
  player1Name = L.nick; player2Name = R.nick
  winScore = m.win_score || 7
  document.getElementById("settingsWinVal").textContent = winScore
  judge.startedAt = new Date().toISOString()
  if (st) applyState(st)
  setModeUI(); renderJudgePlayers()
  lastTournamentId = m.tournament_id
  await rpc("start_match", { p_match: m.id }).catch(() => {})   // teprve pak posílat body (převzetí)
  if (judge.match !== m) return
  updateSendResultButton()
  showOverlay(st ? `POKRAČUJE ${score1}:${score2}` : `${L.nick} VS ${R.nick}`, "win")
}

function unloadJudge() {
  judge.match = null
  judge.sides = { 1: null, 2: null }
  judge.battles = []
  player1Name = ""; player2Name = ""
  document.body.classList.remove("has-match")
  resetPlayersInfo()
  if (judgeMode) { setModeUI(); renderJudgePlayers() }
}

async function cancelMatch() {
  if ((score1 || score2 || judge.battles.length) && !resultSent && !await jConfirm("Zrušit rozehraný zápas? Body se smažou.", "ZRUŠIT")) return
  const m = judge.match
  clearLocal(); unloadJudge(); clearBoard()
  if (m) rpc("pass_match", { p_match: m.id, p_discard: true }).catch(() => {})
}

/* ── PASS JUDGE: předání zápasu, skóre zůstane na serveru ── */
async function passJudge() {
  const m = judge.match
  if (!m) return
  if (!await jConfirm(`Předat zápas <b>${esc(player1Name)} vs ${esc(player2Name)}</b> jinému judge?<br>
    Skóre <b>${score1}:${score2}</b> zůstane uložené a aréna ${m.arena || ""} se uvolní.`, "PŘEDAT")) return
  const p1Left = judge.leftSlot === 1
  clearTimeout(liveTimer)
  try {
    await rpc("live_score", { p_match: m.id, p_p1: p1Left ? score1 : score2, p_p2: p1Left ? score2 : score1, p_state: stateNow() })
    await rpc("pass_match", { p_match: m.id })
  } catch (e) {
    if (/převzal/.test(e.message)) return takenOver(e.message)
    return jAlert(isNetErr(e) ? "Bez připojení nejde zápas předat – další judge by neviděl skóre." : esc(e.message))
  }
  clearLocal(); unloadJudge(); clearBoard()
  showOverlay("ZÁPAS PŘEDÁN", "win")
}

/* ── prohození stran před začátkem hry ── */
function swapSides() {
  if (!canSwap()) return
  if (trainingMode) { tr.leftSlot = 3 - tr.leftSlot; trSaveLeft(); trRender(); if (vibrateEnabled) navigator.vibrate?.(30); return showOverlay(`${player1Name} ⇄ ${player2Name}`, "win") }
  judge.leftSlot = 3 - judge.leftSlot
  ;[judge.sides[1], judge.sides[2]] = [judge.sides[2], judge.sides[1]]
  ;[player1Name, player2Name] = [player2Name, player1Name]
  if (vibrateEnabled) navigator.vibrate?.(30)
  renderJudgePlayers(); renderJudgeBar()
  showOverlay(`${player1Name} ⇄ ${player2Name}`, "win")
}

/* ── zpět do turnaje v BBXU ── */
async function goBBXU() {
  if (!judgeMode && (score1 || score2) && !await jConfirm("Rozehrané skóre se ztratí. Odejít do BBXU?", "ODEJÍT")) return
  backToBBXU()
}
let lastTournamentId = new URLSearchParams(location.search).get("t")
async function backToBBXU() {
  if (judgeHasMatch() && !resultSent) { clearTimeout(liveTimer); await pushLive() }   // rozehraná hra zůstane uložená
  const t = judge.match?.tournament_id || lastTournamentId
  location.href = BBXU_URL + (t ? `#/t/${t}/judge` : "#/")
}

/* ── po dohraném zápase: další na stejné aréně ── */
async function afterMatchNext(next) {
  let queue = []
  try { queue = await rpc("judge_arena_queue", { p_tournament: next.tournament_id, p_arena: next.arena }) } catch (e) {}
  const m = queue[0]
  if (!m) {
    jShow(`<h3>ARÉNA ${next.arena}</h3><p>Teď tu nic dalšího nečeká. Další kolo se objeví, až ho organizátor vylosuje.</p>
      <div class="jRow"><button class="qr-btn cancel" onclick="backToBBXU()">◂ BBXU</button>
      <button class="qr-btn confirm" onclick="jHide()">OK</button></div>`)
    return
  }
  jShow(`<h3>DALŠÍ NA ARÉNĚ ${next.arena}</h3>
    <p><b style="color:var(--cyan)">${esc(m.p1.nick)}</b> vs <b style="color:var(--red)">${esc(m.p2.nick)}</b></p>
    <div class="jRow"><button class="qr-btn cancel" onclick="backToBBXU()">◂ BBXU</button>
    <button class="qr-btn cancel" id="jStay" title="Zůstat v BBXST, judge mód zůstane zapnutý">ZPĚT</button>
    <button class="qr-btn confirm" id="jNext">NAČÍST ZÁPAS</button></div>`)
  document.getElementById("jStay").onclick = () => jHide()   // judge mód zůstane, jen zavřít nabídku
  document.getElementById("jNext").onclick = () => { jHide(); loadMatch(m) }
}

/* ── ruční výběr zápasu (bez QR): dlaždice arén → fronta arény ── */
let arenaPoll = null
function stopArenaPoll() { clearInterval(arenaPoll); arenaPoll = null }
async function openManualMatch(pre = {}) {
  if (!judgeMode) return
  stopArenaPoll()
  jShow(`<h3>VYBRAT ZÁPAS</h3><p>Načítám turnaje…</p>`)
  try {
    const { data: { session } } = await sb.auth.getSession()
    const meId = session?.user?.id
    const { data: ts, error: e1 } = await sb.from("tournaments").select("id,name,arena_count,status")
      .in("status", ["swiss", "topcut"]).order("started_at", { ascending: false })
    if (e1) throw e1
    if (!ts.length) return jAlert("Teď neběží žádný turnaj.")
    let tId = pre.tournament_id || lastTournamentId || ts[0].id
    if (!ts.some(t => t.id === tId)) tId = ts[0].id
    // „moje“ aréna = ta, kde právě řídím rozehraný zápas
    const myArena = () => arenas.find(a => a.queue[0]?.status === "live" && a.queue[0]?.judge_id === meId)?.no
    let arenas = [], arena = pre.arena || null, sel = 0

    const tSelect = () => ts.length > 1
      ? `<select id="mT">${ts.map(x => `<option value="${x.id}" ${x.id === tId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>`
      : `<p class="mTname">${esc(ts[0].name)}</p>`
    const bindT = () => {
      const el = document.getElementById("mT")
      if (el) el.onchange = (e) => { tId = e.target.value; arena = null; loadAll() }
    }

    // přehled všech arén
    const tileHTML = (a) => {
      const m = a.queue[0], mine = a.no === myArena()
      const live = m?.status === "live", free = live && !m.judge_id
      const sc = live && m.live_p1 != null ? `<b class="tSc">${m.live_p1}:${m.live_p2}</b>` : ""
      const who = live && m.judge_nick ? m.judge_nick : a.judge
      return `<button class="aTile ${mine ? "mine" : ""} ${free ? "free" : ""} ${m ? "" : "empty"}" data-a="${a.no}">
        <span class="tHead"><span class="tNo">ARÉNA ${a.no}</span><span class="tJudge">${who ? esc(who) : live ? "bez judge" : "volná"}</span></span>
        ${m ? `<span class="tVs"><span class="n1">${esc(m.p1.nick)}</span><span class="tMid">${sc || "vs"}</span><span class="n2">${esc(m.p2.nick)}</span></span>
          <span class="tMeta"><span class="${free ? "tFreeSpot" : live ? "tLive" : ""}">${free ? "◆ volné místo" : live ? "● hraje se" : "na řadě"}</span>${m.best_of > 1 ? ` · BO${m.best_of} ${m.p1_wins}:${m.p2_wins}` : ""}${a.queue.length > 1 ? ` · +${a.queue.length - 1} ${a.queue.length === 2 ? "další" : "dalších"}` : ""}</span>`
          : `<span class="tFree">nic nečeká</span>`}
      </button>`
    }
    const tilesHTML = () => arenas.map(tileHTML).join("")
    const bindTiles = () => document.querySelectorAll(".aTile").forEach(el => el.onclick = () => {
      arena = Number(el.dataset.a); sel = 0; drawArena()
    })
    const drawTiles = () => {
      jShow(`<h3>VYBER ARÉNU</h3>${tSelect()}<div class="aTiles" id="mTiles">${tilesHTML()}</div>
        <div class="jRow"><button class="qr-btn cancel" onclick="stopArenaPoll();jHide()">ZAVŘÍT</button></div>`, "wide")
      bindT(); bindTiles()
    }

    // fronta jedné arény: vybraný zápas (výchozí ten na řadě) velkým písmem, zbytek fronty pod ním menším
    const drawArena = () => {
      stopArenaPoll()
      const queue = arenas.find(a => a.no === arena)?.queue || []
      if (sel >= queue.length) sel = 0
      const phase = (m) => m.stage === "swiss" ? (m.format === "deathmatch" ? "Deathmatch" : "Swiss") + " · kolo " + m.round : m.stage === "gf" ? (m.top_cut === 2 ? "Finále" : "Grand finále") : esc(m.key)
      const state = (m, i) => m.status === "live"
        ? (m.judge_id ? `● hraje se${m.live_p1 != null ? ` ${m.live_p1}:${m.live_p2}` : ""}${m.judge_nick ? ` · řídí ${esc(m.judge_nick)}` : ""}` : `◆ volné místo${m.live_p1 != null ? ` ${m.live_p1}:${m.live_p2}` : ""}`)
        : i === 0 ? "NA ŘADĚ" : `${i + 1}. v pořadí`
      const f = queue[sel]
      jShow(`<h3>ARÉNA ${arena}</h3>${tSelect()}
        ${f ? `<div class="jNext ${f.status === "live" ? "live" : ""}">
            <div class="jnTag">${state(f, sel)}</div>
            <div class="jnName n1">${esc(f.p1.nick)}</div>
            <div class="jnVs">VS</div>
            <div class="jnName n2">${esc(f.p2.nick)}</div>
            <div class="jnMeta">${phase(f)}${f.best_of > 1 ? ` · BO${f.best_of} (${f.p1_wins}:${f.p2_wins})` : ""}</div>
          </div>
          ${queue.length > 1 ? `<div class="jQueueH">Fronta arény</div>
          <div id="mQ" class="jQueue">${queue.map((m, i) => i === sel ? "" : `
            <div class="jQ" data-i="${i}"><span class="jqNo">${i + 1}.</span>
              <span class="jqNames"><span class="n1">${esc(m.p1.nick)}</span> vs <span class="n2">${esc(m.p2.nick)}</span></span>
              <span class="jqMeta">${m.status === "live" ? (m.judge_id ? "hraje se" : "volné místo") : phase(m)}</span></div>`).join("")}</div>` : ""}`
          : `<p>Na téhle aréně teď nic nečeká.</p>`}
        <div class="jRow"><button class="qr-btn cancel" id="mBack">◂ ARÉNY</button>
          <button class="qr-btn confirm" id="mOk" ${queue.length ? "" : "disabled"}>POTVRDIT ZÁPAS</button></div>`)
      bindT()
      document.getElementById("mBack").onclick = () => { arena = null; drawTiles(); startPoll() }
      document.querySelectorAll(".jQ").forEach(el => el.onclick = () => { sel = Number(el.dataset.i); drawArena() })
      const ok = document.getElementById("mOk")
      if (ok) ok.onclick = () => { const m = queue[sel]; jHide(); loadMatch(m) }
    }

    const fetchAll = async () => {
      const t = ts.find(x => x.id === tId), nos = Array.from({ length: t.arena_count }, (_, i) => i + 1)
      const queues = await Promise.all(nos.map(no => rpc("judge_arena_queue", { p_tournament: tId, p_arena: no })))
      // pořadí určuje server (rozehraný první, hráč, který judguje, o místo níž)
      return nos.map((no, i) => ({ no, queue: queues[i], judge: "" }))
    }
    const startPoll = () => {
      stopArenaPoll()
      arenaPoll = setInterval(async () => {
        const box = document.getElementById("mTiles")
        if (!box || document.getElementById("jOverlay").classList.contains("hidden")) return stopArenaPoll()
        try { arenas = await fetchAll() } catch (e) { return }
        const still = document.getElementById("mTiles")
        if (still) { still.innerHTML = tilesHTML(); bindTiles() }
      }, 8000)
    }
    const loadAll = async () => {
      stopArenaPoll()
      try { arenas = await fetchAll() } catch (e) { arenas = []; jAlert(isNetErr(e) ? "Bez připojení nejde seznam zápasů načíst." : esc(e.message)); return }
      if (arena) drawArena(); else { drawTiles(); startPoll() }
    }
    await loadAll()
  } catch (e) {
    jAlert(isNetErr(e) ? "Bez připojení nejde seznam zápasů načíst." : esc(e.message))
  }
}

/* ── bod → výběr beyů ── */
let pick = null
function scoreFromDrag(side, pts) {
  if (trainingMode) return trScore(side, pts)
  if (!judgeMode) return addScore(side, pts)
  if (!judge.match) return showOverlay("NEJDŘÍV NAČTI ZÁPAS", "xtreme")
  if (matchOver) return
  openPicker(side, pts)
}

function openPicker(side, pts) {
  if (trainingMode) { if (!trActive()) return }
  else if (!judgeHasMatch() || (matchOver && side !== 0)) return
  // druh endu: +3 xtreme, +1 spin, +2 vybere judge (over / burst)
  pick = { side, pts, finish: side === 0 ? null : pts === 3 ? "xtreme" : pts === 1 ? "spin" : null, beys: { 1: null, 2: null } }
  for (const s of [1, 2]) {
    const avail = judge.sides[s].beys.filter(b => b && !cycleUsed(s).includes(b))
    if (avail.length === 1) pick.beys[s] = avail[0]     // poslední bey v kole se doplní sám
  }
  if (pick.beys[1] && pick.beys[2] && !needFinish()) return commitPick()
  drawPicker()
  document.getElementById("pickOverlay").classList.remove("hidden")
}

const needFinish = () => pick && pick.side !== 0 && !pick.finish
const FINISH_NAME = { xtreme: "XTREME", burst: "BURST", over: "OVER", spin: "SPIN" }
function drawPicker() {
  const { side, pts } = pick
  const askFinish = needFinish()
  document.getElementById("pickFinish").classList.toggle("hidden", !askFinish)
  document.getElementById("pickCols").classList.toggle("hidden", askFinish)
  if (askFinish) {
    document.getElementById("pickTitle").innerHTML = `<span class="pts">+${pts}</span> – JAKÝ END?`
    document.querySelectorAll(".finishPick").forEach(btn => btn.onclick = () => {
      if (!pick) return
      pick.finish = btn.dataset.f
      if (pick.beys[1] && pick.beys[2]) return commitPick()
      drawPicker()
    })
    return
  }
  const scorerDone = side === 0 || pick.beys[side]
  const title = side === 0 ? "REMÍZA – KTERÉ BEYE HRÁLY?"
    : !scorerDone ? `KDO SKÓROVAL? <span class="pts">+${pts} ${FINISH_NAME[pick.finish] || ""}</span>`
    : "KTERÝ BEY PROHRÁL?"
  document.getElementById("pickTitle").innerHTML = title
  for (const s of [1, 2]) {
    const col = document.getElementById(s === 1 ? "pickLeft" : "pickRight")
    const used = cycleUsed(s)
    const turn = side === 0 ? !pick.beys[s] : (s === side ? !pick.beys[s] : scorerDone && !pick.beys[s])
    col.classList.toggle("turn", turn)
    const role = side === 0 ? "" : s === side ? "skóroval" : "prohrál"
    col.innerHTML = `<h4>${esc(judge.sides[s].nick)}</h4><div class="hint">${role}</div>` +
      judge.sides[s].beys.map(b => {
        if (!b) return ""
        const cls = pick.beys[s] === b ? (side === 0 ? "win" : s === side ? "win" : "lose") : ""
        const dis = used.includes(b) || (side !== 0 && s !== side && !scorerDone)
        return `<button class="beyPick ${cls}" data-s="${s}" data-b="${esc(b)}" ${dis ? "disabled" : ""}>${esc(b)}</button>`
      }).join("")
  }
  document.querySelectorAll(".beyPick").forEach(btn => btn.onclick = () => {
    pick.beys[Number(btn.dataset.s)] = btn.dataset.b
    drawPicker()
    if (pick.beys[1] && pick.beys[2]) setTimeout(commitPick, 260)
  })
}

function commitPick() {
  if (!pick) return
  const { side, pts, beys, finish } = pick
  pick = null
  document.getElementById("pickOverlay").classList.add("hidden")
  const battle = { slot: side, pts, finish: side === 0 ? null : finish, beys: { 1: beys[1], 2: beys[2] } }
  if (trainingMode) return trCommit(battle)
  if (side === 0) {
    judge.battles.push(battle)
    history.push({ p: 0, pts: 0, battle: true })
    const q = [["REMÍZA", "win"]]
    if (judge.battles.length % 3 === 0) { q.push(["OTOČ ARÉNU", "rotate"]); if (vibrateEnabled) navigator.vibrate?.([120, 80, 120]) }
    showOverlaySequence(q)
    updateSendResultButton()
  } else {
    addScore(side, pts, battle)
  }
  renderJudgePlayers()
}
function closePicker() { pick = null; document.getElementById("pickOverlay").classList.add("hidden") }

/* ── odeslání výsledku ── */
function canSwap() { return trainingMode ? trActive() : judgeHasMatch() && !score1 && !score2 && !judge.battles.length && !resultSent }

/* ── živé skóre pro TV rozpis a hráče ── */
let liveTimer = null, liveSent = ""
function scheduleLive() {
  if (!judgeHasMatch() || resultSent) return
  clearTimeout(liveTimer)
  liveTimer = setTimeout(pushLive, 250)
}
async function pushLive() {
  const m = judge.match
  if (!m || resultSent) return
  const p1Left = judge.leftSlot === 1
  const a = p1Left ? score1 : score2, b = p1Left ? score2 : score1
  const state = stateNow()
  const key = `${m.id}:${a}:${b}:${JSON.stringify(state)}`
  if (key === liveSent) return
  try { await rpc("live_score", { p_match: m.id, p_p1: a, p_p2: b, p_state: state }); liveSent = key }
  catch (e) { if (/převzal/.test(e.message) && judge.match?.id === m.id) takenOver(e.message) }   // bez sítě se pošle s dalším bodem
}

function updateSendResultButton() {
  document.body.classList.toggle("can-swap", canSwap())
  saveLocal()
  scheduleLive()
  const btn = document.getElementById("sendResultBtn")
  const canSend = judgeHasMatch() && (score1 >= winScore || score2 >= winScore) && !resultSent
  btn.style.display = canSend ? "block" : "none"
  btn.disabled = !canSend
  if (canSend) btn.innerText = "✓ ODESLAT VÝSLEDEK"
}

function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || [] } catch (e) { return [] } }
function savePending(list) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)) } catch (e) {} }

async function sendResult() {
  const m = judge.match
  if (!m) return
  const btn = document.getElementById("sendResultBtn")
  btn.disabled = true; btn.innerText = "⟳ ODESÍLÁM…"
  const p1Left = judge.leftSlot === 1
  const payload = {
    p_match: m.id,
    p_p1_score: p1Left ? score1 : score2,
    p_p2_score: p1Left ? score2 : score1,
    p_points: judge.battles.map(b => ({
      slot: b.slot === 0 ? 0 : (p1Left ? b.slot : 3 - b.slot),
      pts: b.pts,
      finish: b.finish || null,
      p1_bey: p1Left ? b.beys[1] : b.beys[2],
      p2_bey: p1Left ? b.beys[2] : b.beys[1],
    })),
    p_client_id: crypto.randomUUID(),
    p_started_at: judge.startedAt,
  }
  let res = null, offline = false
  try { res = await rpc("submit_game", payload) }
  catch (e) {
    if (isNetErr(e)) offline = true
    else if (/převzal/.test(e.message)) return takenOver(e.message)
    else { btn.disabled = false; btn.innerText = "✓ ODESLAT VÝSLEDEK"; return jAlert("Výsledek nešel uložit: " + esc(e.message)) }
  }
  if (offline) {
    savePending([...loadPending(), { ...payload, label: `${player1Name} ${score1}:${score2} ${player2Name}` }])
    // stav BO dopočítáme lokálně
    const w1 = payload.p_p1_score > payload.p_p2_score
    res = { p1_wins: m.p1_wins + (w1 ? 1 : 0), p2_wins: m.p2_wins + (w1 ? 0 : 1) }
    res.match_done = Math.max(res.p1_wins, res.p2_wins) >= Math.floor(m.best_of / 2) + 1
  }
  resultSent = true
  updateSendResultButton()
  m.p1_wins = res.p1_wins; m.p2_wins = res.p2_wins

  if (res.match_done) {
    showOverlaySequence([[offline ? "BEZ SÍTĚ – ODEŠLE SE POZDĚJI" : "ZÁPAS ULOŽEN ✓", offline ? "xtreme" : "win"]])
    const next = { tournament_id: m.tournament_id, arena: m.arena }
    clearLocal()
    setTimeout(() => { unloadJudge(); clearBoard(); if (!offline) afterMatchNext(next) }, 1600)
  } else {
    const lw = judge.leftSlot === 1 ? m.p1_wins : m.p2_wins, rw = judge.leftSlot === 1 ? m.p2_wins : m.p1_wins
    showOverlaySequence([[offline ? "BEZ SÍTĚ – ODEŠLE SE POZDĚJI" : `HRA ULOŽENA · ${lw}:${rw}`, offline ? "xtreme" : "win"], ["DALŠÍ HRA", "win"]])
    setTimeout(() => { clearBoard(); judge.startedAt = new Date().toISOString(); renderJudgePlayers(); renderJudgeBar() }, 1400)
  }
}

let flushing = false
async function flushJudgePending() {
  if (flushing || !sb || !navigator.onLine) return
  let list = loadPending()
  if (!list.length) return
  flushing = true
  let sent = 0
  while (list.length) {
    const { label, ...payload } = list[0]
    try { await rpc("submit_game", payload); sent++ }
    catch (e) {
      if (isNetErr(e)) break
      jAlert(`Uložený výsledek <b>${esc(label)}</b> server odmítl: ${esc(e.message)}`)   // např. organizátor zadal ručně
    }
    list.shift(); savePending(list)
  }
  flushing = false
  if (sent && !list.length) showOverlay("ULOŽENÉ VÝSLEDKY ODESLÁNY ✓", "win")
}
window.addEventListener("online", flushJudgePending)

/* ══════════════════════════════════════════════
   TRAINING MÓD – komunitní trénink z BBXU
   Výzva (soupeř potvrdí) → oba telefony zapisují souboje (RPC training_battle),
   stav se sdílí přes training_state (realtime + polling). Mód 3v3 / 3v1 / 1v3 / 1v1,
   body na hru číslo nebo ∞, sestavy jdou měnit v setupu.
══════════════════════════════════════════════ */
const TR_KEY = "bbxst_training"
const TR_LEFT = "bbxst_training_left"
function trSaveLeft() { try { localStorage.setItem(TR_LEFT, `${tr.match?.id}:${tr.leftSlot}`) } catch (e) {} }
function trSavedLeft(id) {
  try { const [mid, slot] = String(localStorage.getItem(TR_LEFT) || "").split(":"); return mid === id ? Number(slot) || 0 : 0 } catch (e) { return 0 }
}
let trainingMode = false
const tr = { info: null, match: null, leftSlot: 1, pending: [], ch: null, poll: null, waitPoll: null, lastWin: "", parts: null, edit: null }
const trActive = () => trainingMode && tr.match?.status === "active"
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => (Math.random() * 16 | 0).toString(16))
const dbSlot = (side) => side === 0 ? 0 : (side === 1 ? tr.leftSlot : 3 - tr.leftSlot)
const sideOf = (slot) => slot === 0 ? 0 : (slot === tr.leftSlot ? 1 : 2)
const modeCounts = (mode) => { const [a, b] = String(mode || "3v3").split("v").map(Number); return { 1: a || 3, 2: b || 3 } }
const lineupOf = (slot) => (tr.match?.settings?.lineup?.["p" + slot] || [])
const trBeys = (slot) => lineupOf(slot).slice(0, modeCounts(tr.match?.settings?.mode)[slot]).map(b => b.name)

async function trLoadInfo() {
  if (!sb) return null
  try {
    const { data: { session } } = await sb.auth.getSession()
    if (!session || session.user.is_anonymous) { tr.info = null; tr.uid = null }
    else { tr.uid = session.user.id; tr.info = await rpc("my_training") }
  } catch (e) { /* bez sítě nech poslední */ }
  document.body.classList.toggle("has-training", !!tr.info || trainingMode)
  return tr.info
}

function trSetModeUI() {
  document.body.classList.toggle("training", trainingMode)
  document.body.classList.toggle("has-tmatch", trActive())
  document.body.classList.toggle("has-training", !!tr.info || trainingMode)
  document.getElementById("trainLabel").textContent = !trainingMode ? "TRAINING" : trActive() ? "SETUP" : "HRÁČI"
  document.getElementById("trainBtnBar").textContent = trActive() ? "SETUP" : "HRÁČI"
  document.body.classList.toggle("can-swap", canSwap())
}

async function enterTraining(silent) {
  if (judgeMode) { if (judgeHasMatch() && (score1 || score2) && !resultSent) return jAlert("Nejdřív dokonči nebo předej judge zápas."); unloadJudge(); judgeMode = false; setModeUI() }
  if (!(await trLoadInfo())) {
    jAlert(`Training mód je pro hráče přihlášené na <b>komunitní trénink</b>.<br>Přidej se na trénink v <a href="${BBXU_URL}#/">BBXU</a> (stejný účet jako tady).`)
    return false
  }
  trainingMode = true
  clearBoard(); resetPlayersInfo()
  winScore = 7
  trSetModeUI(); trRender()
  if (!silent) showOverlay("TRAINING MÓD", "win")
  return true
}

function exitTraining(silent) {
  trLeaveJudge()
  trUnload()
  trainingMode = false
  try { localStorage.removeItem(TR_KEY) } catch (e) {}
  clearBoard(); resetPlayersInfo()
  winScore = 7; document.getElementById("settingsWinVal").textContent = winScore
  trSetModeUI()
  document.getElementById("trCircle").classList.add("hidden")
  document.getElementById("trSetup").classList.add("hidden")
  if (!silent) showOverlay("CASUAL MÓD", "win")
}

function trUnload() {
  if (tr.ch) { sb.removeChannel(tr.ch); tr.ch = null }
  clearInterval(tr.poll); tr.poll = null
  clearInterval(tr.waitPoll); tr.waitPoll = null
  tr.match = null; tr.pending = []; tr.lastWin = ""
  judge.sides = { 1: null, 2: null }; judge.battles = []
  player1Name = ""; player2Name = ""
}

// judge cizí dvojice: odejít (uvolní judge_id na serveru, jen když jsem to pořád já)
const trIsJudge = () => tr.match?.me === 0
function trLeaveJudge() {
  if (!trIsJudge()) return Promise.resolve()
  return rpc("training_judge", { p_match: tr.match.id, p_on: false }).catch(() => {})
}

async function trLoadMatch(id, quiet) {
  let st
  try { st = await rpc("training_state", { p_match: id }) } catch (e) {
    if (quiet && !isNetErr(e)) { try { localStorage.removeItem(TR_KEY) } catch (x) {} ; return }   // obnova po startu: už nejsem judge
    return jAlert(esc(e.message))
  }
  if (st.status === "pending") {
    if (st.me === 2) {
      if (!await jConfirm(`<b>${esc(st.p1.nick)}</b> tě vyzývá na trénink. Přijmout?`, "PŘIJMOUT")) return
      try { await rpc("training_respond", { p_match: id, p_accept: true }) } catch (e) { return jAlert(esc(e.message)) }
      st = await rpc("training_state", { p_match: id })
    } else return trWait(st)
  }
  if (st.status !== "active") { try { localStorage.removeItem(TR_KEY) } catch (e) {} ; return jAlert(st.status === "declined" ? `${esc(st.p2.nick)} výzvu odmítl.` : "Tenhle souboj už je ukončený.") }
  if (!trainingMode && !(await enterTraining(true))) return
  if (tr.match?.id !== id) trLeaveJudge()
  trUnload()
  tr.match = st
  tr.leftSlot = trSavedLeft(id) || st.me || 1     // já vlevo, pokud strany neprohodil (judge: vyzyvatel vlevo)
  try { localStorage.setItem(TR_KEY, id) } catch (e) {}
  if (sb) tr.ch = sb.channel("trm-" + id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "training_matches", filter: `id=eq.${id}` }, () => trRefresh())
    .subscribe()
  tr.poll = setInterval(trRefresh, 4000)
  document.getElementById("trCircle").classList.add("hidden")
  trSetModeUI(); trRender()
  if (!quiet) showOverlay(`${trIsJudge() ? "JUDGE · " : ""}${player1Name} VS ${player2Name}`, "win")
}

// čeká, až vyzvaný potvrdí
function trWait(st) {
  jShow(`<h3>VÝZVA ODESLÁNA</h3><p>Čekám, až <b>${esc(st.p2.nick)}</b> potvrdí výzvu (v BBXU nebo v BBXST).</p>
    <div class="jRow"><button class="qr-btn cancel" id="trWaitNo">ZRUŠIT VÝZVU</button><button class="qr-btn confirm" id="trWaitOk">SCHOVAT</button></div>`)
  document.getElementById("trWaitOk").onclick = () => { jHide() }
  document.getElementById("trWaitNo").onclick = async () => {
    clearInterval(tr.waitPoll); tr.waitPoll = null; jHide()
    await rpc("training_end", { p_match: st.id }).catch(() => {})
    trOpenCircle()
  }
  clearInterval(tr.waitPoll)
  tr.waitPoll = setInterval(async () => {
    let s2; try { s2 = await rpc("training_state", { p_match: st.id }) } catch (e) { return }
    if (s2.status === "pending") return
    clearInterval(tr.waitPoll); tr.waitPoll = null; jHide()
    if (s2.status === "active") { if (vibrateEnabled) navigator.vibrate?.([200, 100, 200]); trLoadMatch(st.id) }
    else jAlert(`<b>${esc(st.p2.nick)}</b> výzvu odmítl.`)
  }, 2000)
}

async function trRefresh() {
  const id = tr.match?.id
  if (!id) return
  await trFlush()
  try {
    const st = await rpc("training_state", { p_match: id })
    if (tr.match?.id !== id) return
    const before = tr.match.last_seq
    tr.match = st
    if (st.status !== "active") {
      trUnload(); trSetModeUI(); trRender()
      try { localStorage.removeItem(TR_KEY) } catch (e) {}
      return showOverlay("SOUBOJ UKONČEN", "win")
    }
    if (st.me === 0 && tr.uid && st.judge?.user_id !== tr.uid) {     // judge převzal někdo jiný
      trUnload(); trSetModeUI(); trRender()
      try { localStorage.removeItem(TR_KEY) } catch (e) {}
      return showOverlay(st.judge ? `JUDGE PŘEVZAL ${st.judge.nick}` : "UŽ NEJSI JUDGE", "xtreme")
    }
    if (st.last_seq !== before) trRender(true)
    else trRender()
  } catch (e) {
    if (isNetErr(e) || tr.match?.id !== id || !trIsJudge()) return     // bez sítě – další pokus za chvíli
    trUnload(); trSetModeUI(); trRender()                               // judge už k dvojici nesmí
    try { localStorage.removeItem(TR_KEY) } catch (x) {}
    showOverlay("UŽ NEJSI JUDGE", "xtreme")
  }
}

// aktuální hra = stav ze serveru + čekající (neodeslané) souboje
function trCompute() {
  const st = tr.match, win = st.settings?.win ?? null
  let no = st.game.no, a = st.game.s1, b = st.game.s2
  const battles = st.battles.map(x => ({ ...x }))
  for (const p of tr.pending) {
    if (win != null && (a >= win || b >= win)) { no++; a = 0; b = 0; battles.length = 0 }
    const pts = p.slot === 0 ? 0 : win == null ? p.pts : Math.min(p.pts, win - (p.slot === 1 ? a : b))
    if (p.slot === 1) a += pts; else if (p.slot === 2) b += pts
    battles.push({ slot: p.slot, pts, finish: p.finish, p1_bey: p.p1_bey, p2_bey: p.p2_bey, pending: true })
  }
  return { no, a, b, win, battles, over: win != null && (a >= win || b >= win) }
}

function trRender(fromServer) {
  const info = document.getElementById("trainInfo")
  trSetModeUI()
  if (!trainingMode) return
  if (!tr.match) {
    s1.innerText = "0"; s2.innerText = "0"
    info.textContent = tr.info ? `${tr.info.tournament.name} · vyber soupeře` : "Komunitní trénink"
    resetPlayersInfo(); document.querySelectorAll(".scanBtn").forEach(b => b.classList.add("hidden"))
    return
  }
  const st = tr.match, c = trCompute()
  const L = tr.leftSlot === 1 ? st.p1 : st.p2, R = tr.leftSlot === 1 ? st.p2 : st.p1
  player1Name = L.nick; player2Name = R.nick
  score1 = tr.leftSlot === 1 ? c.a : c.b; score2 = tr.leftSlot === 1 ? c.b : c.a
  s1.innerText = score1; s2.innerText = score2
  winScore = c.win ?? 99
  judge.sides = { 1: { nick: L.nick, beys: trBeys(tr.leftSlot) }, 2: { nick: R.nick, beys: trBeys(3 - tr.leftSlot) } }
  judge.battles = c.battles.map(x => ({ slot: sideOf(x.slot), pts: x.pts, beys: { 1: tr.leftSlot === 1 ? x.p1_bey : x.p2_bey, 2: tr.leftSlot === 1 ? x.p2_bey : x.p1_bey } }))
  if (!firstScoreUsed && (score1 || score2)) { firstScoreUsed = true; document.querySelectorAll(".arrowGroup").forEach(a => a.classList.add("hidden")) }
  renderJudgePlayers()
  info.textContent = [st.me === 0 ? "JUDGE" : st.judge ? `judge ${st.judge.nick}` : "", st.tournament?.name, (st.settings?.mode || "3v3").replace("v", " v "), `hra ${c.no}`,
    c.win == null ? "bez limitu" : `do ${c.win}`, st.settings?.tourney ? "tournament" : "", c.over ? "dohráno" : ""].filter(Boolean).join(" · ")
  info.title = info.textContent
  // výhra soupeře zapsaná z druhého telefonu
  const key = `${st.id}:${c.no}`
  if (c.over && tr.lastWin !== key) {
    tr.lastWin = key
    if (fromServer) {
      const lw = score1 >= winScore
      showOverlay(`${lw ? player1Name : player2Name} WINS`, "win")
    }
  }
}

function trScore(side, pts) {
  if (!trActive()) { showOverlay("VYBER SOUPEŘE", "xtreme"); return trOpenCircle() }
  openPicker(side, pts)
}

async function trCommit(battle) {
  const slot = dbSlot(battle.slot)
  const nameOf = (s) => battle.beys[sideOf(s)] || null
  const idx = (s) => { const n = nameOf(s); const i = n ? lineupOf(s).findIndex(b => b.name === n) : -1; return i >= 0 ? i : null }
  const before = trCompute()
  const p = { client_id: uuid(), slot, pts: battle.slot === 0 ? 0 : battle.pts, finish: battle.finish || null,
              i1: idx(1), i2: idx(2), p1_bey: nameOf(1), p2_bey: nameOf(2) }
  tr.pending.push(p)
  trRender()
  const after = trCompute()
  // hlášky jako v judge módu
  const q = []
  if (battle.slot === 0) q.push(["REMÍZA", "win"])
  else {
    if (battle.pts === 3) q.push(["XTREME FINISH", "xtreme"])
    if (after.over && !before.over) { const lw = (battle.slot === 1); q.push([`${lw ? player1Name : player2Name} WINS`, "win"]); tr.lastWin = `${tr.match.id}:${after.no}` }
  }
  if (q.length) showOverlaySequence(q)
  if (battle.slot !== 0) startCooldown()
  await trFlush()
}

let trFlushing = false
async function trFlush() {
  if (trFlushing || !tr.match || !tr.pending.length) return
  trFlushing = true
  try {
    while (tr.pending.length) {
      const p = tr.pending[0]
      try {
        const st = await rpc("training_battle", { p_match: tr.match.id, p_client_id: p.client_id, p_slot: p.slot, p_pts: p.pts,
                                                  p_finish: p.finish, p_i1: p.i1, p_i2: p.i2 })
        tr.pending.shift(); tr.match = st
      } catch (e) {
        if (isNetErr(e)) break            // pošle se při dalším pokusu
        tr.pending.shift(); jAlert(esc(e.message))
      }
    }
  } finally { trFlushing = false; trRender() }
}
window.addEventListener("online", trFlush)

async function trUndo() {
  if (!trActive()) return
  if (tr.pending.length) { tr.pending.pop(); return trRender() }
  try { tr.match = await rpc("training_undo", { p_match: tr.match.id }); tr.lastWin = ""; trRender(); showOverlay("REVERT", "win") }
  catch (e) { jAlert(isNetErr(e) ? "Bez připojení nejde vrátit souboj." : esc(e.message)) }
}

// RESET v tréninku = nová hra: skóre i zahrané beye od nuly, odehrané souboje zůstanou v historii
async function trReset() {
  if (!trActive()) return
  const c = trCompute()
  if (!c.battles.length && !c.a && !c.b) return showOverlay("0 : 0", "win")
  if (!await jConfirm("Vynulovat skóre i zahrané beye a začít <b>novou hru</b>?<br><small>Odehrané souboje zůstanou v historii tréninku.</small>", "NOVÁ HRA")) return
  try {
    await trFlush()
    if (tr.pending.length) throw new Error("offline")
    tr.match = await rpc("training_new_game", { p_match: tr.match.id })
    tr.lastWin = ""
    firstScoreUsed = false
    document.querySelectorAll(".arrowGroup").forEach(a => a.classList.remove("hidden"))
    trRender(); showOverlay("NOVÁ HRA", "win"); startCooldown()
  } catch (e) { jAlert(isNetErr(e) || e.message === "offline" ? "Bez připojení nejde začít novou hru – zkus to znovu, až bude signál." : esc(e.message)) }
}

function trPrimary() { trActive() ? trOpenSetup() : trOpenCircle() }
function trBackToBBXU() { location.href = BBXU_URL + (tr.match?.tournament_id || tr.info?.tournament?.id ? `#/t/${tr.match?.tournament_id || tr.info.tournament.id}` : "#/") }

/* ── kolečko hráčů ── */
async function trOpenCircle() {
  await trLoadInfo()
  const box = document.getElementById("trCircle")
  if (!tr.info) { box.classList.add("hidden"); return jAlert("Nejsi přihlášený na žádný otevřený komunitní trénink.") }
  const ps = tr.info.players, ms = tr.info.matches
  const n = Math.max(ps.length, 1)
  box.innerHTML = `<div class="trTitle">${esc(tr.info.tournament.name)}</div>
    <div class="trRing">
      <div class="trCenter"><b>VYZVI HRÁČE</b><small>${esc(tr.info.tournament.community || "")}</small></div>
      ${ps.map((p, i) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / n
        const x = 50 + 41 * Math.cos(a), y = 50 + 41 * Math.sin(a)
        const m = ms.find(z => z.opp_reg === p.reg)
        const cls = !m ? "" : m.status === "active" ? "active" : m.incoming ? "incoming" : "outgoing"
        const tag = !m ? "" : m.status === "active" ? "POKRAČOVAT" : m.incoming ? "VYZVAL TĚ" : "ČEKÁ"
        return `<button class="trP ${cls} ${p.bot ? "bot" : ""}" style="left:${x}%;top:${y}%" data-reg="${p.reg}">${p.bot ? "🤖 " : ""}${esc(p.nick)}${tag ? `<small>${tag}</small>` : p.bot ? "<small>BOT</small>" : ""}</button>`
      }).join("")}
    </div>
    ${ps.length ? "" : `<div class="trSub">Na tréninku zatím nikdo další není.</div>`}
    <div class="trBtns"><button class="qr-btn cancel" id="trCircleCasual">CASUAL</button>
      <button class="qr-btn cancel" id="trCircleJudge">JUDGE${(tr.info.live || []).length ? ` · ${tr.info.live.length}` : ""}</button>
      <button class="qr-btn confirm" id="trCircleClose">ZPĚT</button></div>`
  box.classList.remove("hidden")
  document.getElementById("trCircleClose").onclick = () => box.classList.add("hidden")
  document.getElementById("trCircleJudge").onclick = () => trOpenJudge()
  document.getElementById("trCircleCasual").onclick = () => exitTraining()
  box.querySelectorAll(".trP").forEach(b => b.onclick = async () => {
    const reg = b.dataset.reg, m = ms.find(z => z.opp_reg === reg)
    if (m) return trLoadMatch(m.id)
    try {
      const id = await rpc("training_challenge", { p_tournament: tr.info.tournament.id, p_opponent: reg })
      box.classList.add("hidden")
      trLoadMatch(id)
    } catch (e) { jAlert(esc(e.message)) }
  })
}

/* ── judge: kdo s kým hraje → připojit se a zapisovat za ně ── */
async function trOpenJudge() {
  await trLoadInfo()
  const box = document.getElementById("trCircle")
  if (!tr.info) { box.classList.add("hidden"); return jAlert("Nejsi přihlášený na žádný otevřený komunitní trénink.") }
  const live = tr.info.live || []
  box.innerHTML = `<div class="trTitle">JUDGE · KDO S KÝM HRAJE</div>
    <div class="trSub">${esc(tr.info.tournament.name)}</div>
    <div class="trLive">${live.length ? live.map(m => `<button class="trLiveRow ${m.judge ? "judged" : ""} ${m.mine ? "mine" : ""}" data-id="${m.id}">
        <span class="vs">${esc(m.p1)}<i>vs</i>${esc(m.p2)}<small>${esc(m.mode.replace("v", " v "))} · hra ${m.game} · ${m.win == null ? "bez limitu" : "do " + m.win}${m.mine ? " · TY JUDGUJEŠ" : m.judge ? " · judge " + esc(m.judge) : " · bez judge"}</small></span>
        <span class="sc">${m.s1}:${m.s2}</span></button>`).join("")
      : `<div class="trSub">Teď nikdo jiný nehraje. Až se dva vyzvou, objeví se tady.</div>`}</div>
    <div class="trBtns"><button class="qr-btn cancel" id="trJudgeBack">◂ HRÁČI</button><button class="qr-btn cancel" id="trJudgeReload">OBNOVIT</button>
      <button class="qr-btn confirm" id="trJudgeClose">ZPĚT</button></div>`
  box.classList.remove("hidden")
  document.getElementById("trJudgeBack").onclick = () => trOpenCircle()
  document.getElementById("trJudgeReload").onclick = () => trOpenJudge()
  document.getElementById("trJudgeClose").onclick = () => box.classList.add("hidden")
  box.querySelectorAll(".trLiveRow").forEach(b => b.onclick = async () => {
    const m = live.find(x => x.id === b.dataset.id)
    if (!m.mine) {
      const q = m.judge ? `Dvojici <b>${esc(m.p1)} vs ${esc(m.p2)}</b> teď judguje <b>${esc(m.judge)}</b>. Převzít?`
                        : `Judgovat <b>${esc(m.p1)} vs ${esc(m.p2)}</b>? Souboje budeš zapisovat za ně.`
      if (!await jConfirm(q, m.judge ? "PŘEVZÍT" : "JUDGOVAT")) return
      try { await rpc("training_judge", { p_match: m.id, p_on: true }) } catch (e) { return jAlert(esc(e.message)) }
    }
    box.classList.add("hidden")

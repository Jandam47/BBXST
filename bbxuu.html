<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pardubice Beyblade X – Team Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14;
    --bg2: #0f0f1e;
    --bg3: #14142a;
    --card: #16162e;
    --card2: #1c1c38;
    --accent: #e63946;
    --accent2: #ff6b6b;
    --blue: #4361ee;
    --blue2: #4cc9f0;
    --gold: #ffd60a;
    --text: #e8e8f0;
    --muted: #7878a0;
    --border: rgba(255,255,255,0.07);
    --glow: 0 0 20px rgba(230,57,70,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND ===== */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(67,97,238,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(67,97,238,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .bg-orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(80px); opacity: 0.15;
  }
  .orb1 { width: 500px; height: 500px; background: #e63946; top: -200px; right: -150px; }
  .orb2 { width: 400px; height: 400px; background: #4361ee; bottom: -150px; left: -100px; }

  /* ===== SCREENS ===== */
  .screen { position: relative; z-index: 1; display: none; }
  .screen.active { display: flex; }

  /* ===== MODAL / OVERLAY ===== */
  #screen-landing {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .logo-wrap { text-align: center; margin-bottom: 36px; }
  .logo-main {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #e63946, #ff6b6b, #ffd60a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  .logo-sub {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 8px;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .beyblade-icon {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    display: block;
    animation: spin 4s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .warning-box {
    background: rgba(230,57,70,0.08);
    border: 1px solid rgba(230,57,70,0.3);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 28px;
    max-width: 440px;
    font-size: 14px;
    color: #ff9da5;
    text-align: center;
    line-height: 1.6;
  }
  .warning-box strong { color: var(--accent2); display: block; margin-bottom: 4px; font-size: 15px; }

  .landing-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%; max-width: 420px;
    backdrop-filter: blur(10px);
  }
  .landing-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 24px;
    text-align: center;
    letter-spacing: 1px;
  }

  /* ===== TABS ===== */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1; padding: 10px 8px;
    border: none; border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.5px;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px rgba(230,57,70,0.4);
  }

  /* ===== FORMS ===== */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus { border-color: rgba(67,97,238,0.6); }
  .form-group input[type="number"]::-webkit-inner-spin-button { opacity: 0; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #c1121f);
    color: #fff;
    box-shadow: 0 4px 15px rgba(230,57,70,0.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(230,57,70,0.5); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    margin-top: 10px;
    font-size: 13px;
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

  .error-msg {
    background: rgba(230,57,70,0.12);
    border: 1px solid rgba(230,57,70,0.3);
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--accent2);
    margin-bottom: 16px;
    display: none;
  }
  .success-msg {
    background: rgba(38,182,100,0.12);
    border: 1px solid rgba(38,182,100,0.3);
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 14px;
    color: #26b664;
    margin-bottom: 16px;
    display: none;
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0;
    color: var(--muted); font-size: 13px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  /* ===== LOBBY ===== */
  #screen-lobby {
    flex-direction: column;
    min-height: 100vh;
    padding: 0;
  }
  .top-bar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .top-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .user-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .user-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #26b664;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .ghost-icon { font-size: 16px; }

  .lobby-content {
    padding: 32px 24px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .rooms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 40px;
  }
  .room-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all .25s;
    position: relative;
    overflow: hidden;
  }
  .room-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
    transition: opacity .2s;
    opacity: 0;
  }
  .room-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .room-card:hover::before { opacity: 1; }
  .room-card.r1::before { background: #4cc9f0; }
  .room-card.r2::before { background: var(--gold); }
  .room-card.r3::before { background: #7bed9f; }
  .room-card.r4::before { background: #ff6b6b; }
  .room-card.r5::before { background: #a29bfe; }
  .room-card.r6::before { background: var(--accent); }

  .room-icon { font-size: 28px; margin-bottom: 10px; }
  .room-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
  }
  .room-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .link-tile {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    transition: all .2s;
    display: flex; align-items: center; gap: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .link-tile:hover {
    border-color: rgba(76,201,240,0.4);
    background: rgba(76,201,240,0.05);
    transform: translateY(-1px);
  }
  .link-tile-icon {
    width: 36px; height: 36px;
    background: rgba(67,97,238,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: 7px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .logout-btn:hover { color: var(--accent); border-color: rgba(230,57,70,0.4); }

  /* ===== CHAT ROOM ===== */
  #screen-chat {
    flex-direction: column;
    min-height: 100vh;
  }
  .chat-header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
    justify-content: space-between;
  }
  .chat-header-left {
    display: flex; align-items: center; gap: 14px;
  }
  .back-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: 7px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .chat-room-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px; font-weight: 700;
    color: var(--text);
  }
  .chat-room-icon { font-size: 22px; }

  /* ===== REFRESH TIMER ===== */
  .refresh-timer {
    position: relative;
    width: 40px;
    height: 40px;
  }
  .timer-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    position: relative;
    overflow: hidden;
  }
  .timer-circle::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    border-right-color: transparent;
    border-bottom-color: transparent;
    transform: rotate(0deg);
    opacity: 0;
  }
  .timer-circle.active::before {
    animation: rotateTimer 1s linear;
    opacity: 1;
  }
  @keyframes rotateTimer {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .timer-circle.loading {
    border-color: var(--accent);
    color: var(--accent);
  }

  .messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    max-height: calc(100vh - 140px);
  }
  .message {
    display: flex;
    gap: 10px;
    max-width: 75%;
  }
  .message.own { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
    font-family: 'Rajdhani', sans-serif;
  }
  .avatar.ghost {
    background: linear-gradient(135deg, #555, #333);
    font-size: 18px;
  }
  .msg-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg-nick {
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
  }
  .msg-text {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .message.own .msg-text {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .msg-time {
    font-size: 11px;
    color: var(--muted);
  }

  .empty-chat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    gap: 12px;
    color: var(--muted);
  }
  .empty-chat-icon { font-size: 40px; }

  .chat-input-wrap {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex; gap: 10px;
    align-items: flex-end;
  }
  #chat-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    resize: none;
    max-height: 100px;
    min-height: 40px;
  }
  #chat-input:focus { border-color: rgba(67,97,238,0.6); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), #c1121f);
    border: none;
    border-radius: 8px;
    color: #fff;
    padding: 10px 18px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
    height: 40px;
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(230,57,70,0.4); }
  .send-btn:active { transform: scale(0.98); }

  /* ===== LOADING OVERLAY ===== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 30px;
  }
  .loading-overlay.active {
    display: flex;
  }

  .spinner-container {
    position: relative;
    width: 120px;
    height: 120px;
  }
  .spinner-circle {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 3px solid var(--border);
    border-radius: 50%;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    animation: spinnerRotate 2s linear infinite;
  }
  @keyframes spinnerRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .countdown-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
  }
  .countdown-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--text);
    z-index: 1000;
    animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- ===== LOADING SCREEN ===== -->
<div id="loading" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="text-align:center;">
    <div style="width:60px;height:60px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 20px;animation:spin 1.5s linear infinite;"></div>
    <div style="font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;">Načítání...</div>
  </div>
</div>

<!-- ===== LOADING OVERLAY (pro místnosti) ===== -->
<div id="loading-overlay" class="loading-overlay">
  <div class="spinner-container">
    <div class="spinner-circle"></div>
  </div>
  <div>
    <div class="countdown-display" id="countdown-display">5</div>
    <div class="countdown-label">Načítání konverzace</div>
  </div>
</div>

<!-- ===== LANDING ===== -->
<div id="screen-landing" class="screen">
  <div class="logo-wrap">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%23e63946' stroke-width='2'/%3E%3Cpolygon points='50,15 85,75 15,75' fill='%23e63946' opacity='0.8'/%3E%3C/svg%3E" class="beyblade-icon" />
    <h1 class="logo-main">PBX CHAT</h1>
    <p class="logo-sub">TEAM HUB</p>
  </div>

  <div class="landing-card">
    <div class="warning-box">
      <strong>⚠️ BETA</strong>
      Aplikace je stále ve vývoji. Hlašte chyby!
    </div>

    <div class="landing-title">Přihlášení</div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Přihlášení</button>
      <button class="tab" onclick="showTab('register')">Registrace</button>
    </div>

    <!-- ===== LOGIN ===== -->
    <div id="tab-login">
      <div class="form-group">
        <label>Nick</label>
        <input type="text" id="login-nick" placeholder="Tvůj nick...">
      </div>
      <div class="form-group">
        <label>PIN (4 číslice)</label>
        <input type="password" id="login-pin" placeholder="0000">
      </div>
      <div id="login-error" class="error-msg"></div>
      <button class="btn btn-primary" onclick="doLogin()">VSTOUPIT</button>
      <button class="btn btn-ghost" onclick="guestLogin()">GUEST (bez přihlášení)</button>
    </div>

    <!-- ===== REGISTER ===== -->
    <div id="tab-register" style="display:none;">
      <div class="form-group">
        <label>Nový nick</label>
        <input type="text" id="reg-nick" placeholder="Vymysli si nick...">
      </div>
      <div class="form-group">
        <label>PIN (4 číslice)</label>
        <input type="password" id="reg-pin" placeholder="0000">
      </div>
      <div id="reg-error" class="error-msg"></div>
      <div id="reg-success" class="success-msg"></div>
      <button class="btn btn-primary" onclick="doRegister()">REGISTROVAT</button>
    </div>
  </div>
</div>

<!-- ===== LOBBY ===== -->
<div id="screen-lobby" class="screen">
  <div class="top-bar">
    <div class="top-logo">⚔️ PBX CHAT</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="user-badge">
